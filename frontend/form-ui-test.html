<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 表单页UI测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui-common.css">
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-mid: #0f172a;
            --primary-light: #1e293b;
            --tech-accent: #00D2FF;
            --tech-secondary: #0ea5e9;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --text-disabled: rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(0, 210, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 210, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
            padding: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(0, 210, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(14, 165, 233, 0.8) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .nav-logo i {
            font-size: 22px;
            color: white;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00D2FF 0%, #0ea5e9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* 页面标题 */
        .page-header {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00D2FF, transparent);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #00D2FF;
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            padding-left: 36px;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
            padding: 0 40px;
        }

        .step-indicator::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 60px;
            right: 60px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 1;
        }

        .step-indicator .progress-line {
            position: absolute;
            top: 20px;
            left: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00D2FF, #10B981);
            z-index: 2;
            transition: width 0.5s ease;
            width: 33%;
        }

        .step {
            text-align: center;
            position: relative;
            z-index: 3;
            flex: 1;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .step.active .step-circle {
            background: #00D2FF;
            border-color: #00D2FF;
            color: white;
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.2);
        }

        .step.completed .step-circle {
            background: #10B981;
            border-color: #10B981;
            color: white;
        }

        .step-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .step.active .step-label {
            color: white;
            font-weight: 600;
        }

        .step.completed .step-label {
            color: #10B981;
        }

        /* 进度条 */
        .progress-section {
            margin-bottom: 32px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
        }

        .progress-value {
            font-family: "Roboto Mono", monospace;
            font-size: 15px;
            font-weight: 600;
            color: #00D2FF;
        }

        .progress-nodes {
            display: flex;
            gap: 8px;
        }

        .progress-node {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .progress-node.completed {
            background: #10B981;
        }

        .progress-node.active {
            background: #00D2FF;
            animation: node-pulse 1.5s ease-in-out infinite;
        }

        @keyframes node-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* 表单容器 */
        .form-section {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
            padding-left: 16px;
            border-left: 4px solid #00D2FF;
        }

        .section-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 28px;
            padding-left: 20px;
        }

        /* 问题卡片 */
        .question-card {
            margin-bottom: 24px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            border-left: 3px solid #00D2FF;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .question-card:hover {
            background: rgba(0, 210, 255, 0.06);
            border-color: rgba(0, 210, 255, 0.2);
        }

        .question-label {
            font-weight: 600;
            color: white;
            margin-bottom: 16px;
            font-size: 15px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .question-number {
            background: rgba(0, 210, 255, 0.2);
            color: #00D2FF;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .required-mark {
            color: #EF4444;
            margin-left: 4px;
        }

        /* 选项 */
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-item:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .option-item.selected {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .option-radio {
            width: 20px;
            height: 20px;
            accent-color: #00D2FF;
        }

        .option-text {
            color: white;
            font-size: 14px;
        }

        /* 输入框 */
        .glass-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #00D2FF;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
            background: rgba(255, 255, 255, 0.12);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 其他输入 */
        .other-input-wrapper {
            margin-top: 12px;
            padding: 14px;
            background: rgba(0, 210, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #00D2FF;
        }

        .other-input-label {
            font-size: 12px;
            color: #00D2FF;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .glass-btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glass-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
        }

        .glass-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00D2FF;
            color: white;
        }

        .glass-btn-primary {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(14, 165, 233, 0.8) 100%);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .glass-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
        }

        @media (max-width: 768px) {
            .step-indicator {
                padding: 0 20px;
            }
            .step-indicator::before {
                left: 30px;
                right: 30px;
            }
            .step-indicator .progress-line {
                left: 30px;
            }
            .form-section {
                padding: 24px;
            }
            .page-header {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="page-wrapper">
        <!-- 顶部导航 -->
        <nav class="top-nav">
            <a href="/" class="nav-brand">
                <div class="nav-logo">
                    <i class="bi bi-database-fill"></i>
                </div>
                <span class="nav-title">数维数据管家</span>
            </a>
            <div class="nav-user">
                <span style="color: rgba(255,255,255,0.7); font-size: 14px;">张三</span>
                <div class="user-avatar">Z</div>
            </div>
        </nav>

        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-clipboard-data"></i>
                数据资产化深度调研
            </h1>
            <p class="page-subtitle">完成调研问卷，帮助我们更好地了解您的数据资产现状</p>
        </div>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="progress-line"></div>
            <div class="step active">
                <div class="step-circle">1</div>
                <div class="step-label">基本信息</div>
            </div>
            <div class="step">
                <div class="step-circle">2</div>
                <div class="step-label">数据资产</div>
            </div>
            <div class="step">
                <div class="step-circle">3</div>
                <div class="step-label">合规评估</div>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <div class="progress-header">
                <span class="progress-label">当前进度</span>
                <span class="progress-value">33%</span>
            </div>
            <div class="progress-nodes">
                <div class="progress-node completed"></div>
                <div class="progress-node completed"></div>
                <div class="progress-node active"></div>
                <div class="progress-node"></div>
                <div class="progress-node"></div>
                <div class="progress-node"></div>
            </div>
        </div>

        <!-- 表单 -->
        <div class="form-section">
            <h2 class="section-title">基本信息</h2>
            <p class="section-desc">请填写您的基本信息和公司概况</p>

            <!-- 问题1 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">1</span>
                    <span>贵公司所属行业类型？<span class="required-mark">*</span></span>
                </label>
                <div class="option-list">
                    <label class="option-item selected">
                        <input type="radio" class="option-radio" name="q1" checked>
                        <span class="option-text">科技/互联网</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">金融/银行</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">制造业</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">零售/电商</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">其他</span>
                    </label>
                </div>
            </div>

            <!-- 问题2 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">2</span>
                    <span>贵公司员工数量？<span class="required-mark">*</span></span>
                </label>
                <div class="option-list">
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">50人以下</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">50-200人</span>
                    </label>
                    <label class="option-item selected">
                        <input type="radio" class="option-radio" name="q2" checked>
                        <span class="option-text">200-500人</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">500人以上</span>
                    </label>
                </div>
            </div>

            <!-- 问题3 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">3</span>
                    <span>贵公司数据团队规模？<span class="required-mark">*</span></span>
                </label>
                <input type="text" class="glass-input" placeholder="请输入数据团队人数，如：10人" value="8人">
                <div class="other-input-wrapper">
                    <div class="other-input-label">
                        <i class="bi bi-info-circle"></i>
                        说明：数据团队包括数据分析师、数据工程师、BI工程师等
                    </div>
                </div>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="glass-btn glass-btn-secondary">
                <i class="bi bi-arrow-left"></i>
                上一步
            </button>
            <button class="glass-btn glass-btn-primary">
                下一步
                <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="ui-particles.js"></script>
    <script>
        initParticleBackground('particles-canvas', {
            particleCount: 80,
            particleColor: 'rgba(0, 210, 255, 0.6)',
            lineColor: 'rgba(0, 210, 255, 0.2)'
        });
    </script>
</body>
</html>
