<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B3A57;
            --primary-dark: #0F4C81;
            --primary-light: #2E5A7C;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: #E8EDF2;
            --gradient-brand: linear-gradient(135deg, #1B3A57 0%, #00D2FF 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font-family-zh);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
        }
        
        .register-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        
        .brand-section {
            flex: 1;
            background: var(--gradient-brand);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
        }
        
        .brand-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 480px;
        }
        
        .brand-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            backdrop-filter: blur(10px);
        }
        
        .brand-logo i {
            font-size: 40px;
            color: white;
        }
        
        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .brand-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .brand-steps {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
        }
        
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .step-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .step-number {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .step-desc {
            font-size: 13px;
            opacity: 0.8;
        }
        
        .form-section {
            width: 560px;
            min-width: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 70px;
            background: var(--bg-card);
            overflow-y: auto;
        }
        
        .form-header {
            margin-bottom: 28px;
        }
        
        .form-title {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .form-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .form-row {
            display: flex;
            gap: 16px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        
        .form-label .required {
            color: var(--danger-color);
            margin-left: 2px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-disabled);
            font-size: 18px;
            transition: color 0.2s ease;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--tech-accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }
        
        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: var(--tech-accent);
        }
        
        ::placeholder {
            color: var(--text-disabled);
        }
        
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-disabled);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: var(--text-secondary);
        }
        
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: var(--border-light);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .password-strength-bar.weak {
            width: 33%;
            background: var(--danger-color);
        }
        
        .password-strength-bar.medium {
            width: 66%;
            background: var(--warning-color);
        }
        
        .password-strength-bar.strong {
            width: 100%;
            background: var(--success-color);
        }
        
        .password-hint {
            font-size: 11px;
            color: var(--text-disabled);
            margin-top: 4px;
        }
        
        .form-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .form-check-input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .form-check-label {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .form-check-label a {
            color: var(--tech-accent);
            text-decoration: none;
        }
        
        .form-check-label a:hover {
            text-decoration: underline;
        }
        
        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--gradient-brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(27, 58, 87, 0.25);
            margin-top: 20px;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(27, 58, 87, 0.35);
        }
        
        .btn-register:active {
            transform: translateY(0);
        }
        
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-disabled);
            font-size: 13px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        
        .divider span {
            padding: 0 16px;
        }
        
        .login-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .login-link a {
            color: var(--tech-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .login-link a:hover {
            color: var(--primary-color);
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        
        .alert-danger {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }
        
        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }
            
            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 520px;
                margin: 0 auto;
                padding: 40px;
            }
        }
        
        @media (max-width: 600px) {
            .form-section {
                padding: 30px 24px;
            }
            
            .form-title {
                font-size: 22px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="brand-section">
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">让数据价值看得见、可量化、能变现<br>开启数据资产化智能评估之旅</p>
                
                <div class="brand-steps">
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">注册账号</div>
                            <div class="step-desc">填写基本信息，创建您的专属账号</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">填写调研表单</div>
                            <div class="step-desc">回答数据资产相关问题，系统自动分析</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">获取评估报告</div>
                            <div class="step-desc">一键生成专业报告，支持下载与分享</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">创建账号</h2>
                <p class="form-desc">填写以下信息完成注册</p>
            </div>
            
            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">用户名 <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="3-20个字符，字母开头" required minlength="3" maxlength="20" pattern="^[a-zA-Z][a-zA-Z0-9_]*$" autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <div class="input-wrapper">
                            <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" autocomplete="email">
                            <i class="bi bi-envelope"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <div class="input-wrapper">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="11位手机号" pattern="[0-9]{11}" autocomplete="tel">
                            <i class="bi bi-phone"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码 <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('password', 'eyeIcon1')">
                            <i class="bi bi-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">密码强度：未输入</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">确认密码 <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
                        <i class="bi bi-lock-fill"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                            <i class="bi bi-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">推荐码（选填）</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="referrerCode" name="referrerCode" placeholder="如有推荐码请填写">
                        <i class="bi bi-gift"></i>
                    </div>
                </div>
                
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="agreement" name="agreement" required>
                    <label class="form-check-label" for="agreement">
                        我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-register" id="registerBtn">
                    注 册
                </button>
            </form>
            
            <div class="divider">
                <span>已有账号？</span>
            </div>
            
            <div class="login-link">
                <a href="/login">立即登录</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }
        
        function checkPasswordStrength(password) {
            const bar = document.getElementById('passwordStrengthBar');
            const hint = document.getElementById('passwordHint');
            
            bar.classList.remove('weak', 'medium', 'strong');
            
            if (!password) {
                bar.style.width = '0';
                hint.textContent = '密码强度：未输入';
                return;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength <= 2) {
                bar.classList.add('weak');
                hint.textContent = '密码强度：弱';
            } else if (strength <= 4) {
                bar.classList.add('medium');
                hint.textContent = '密码强度：中';
            } else {
                bar.classList.add('strong');
                hint.textContent = '密码强度：强';
            }
        }
        
        document.getElementById('password').addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });
        
        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }
        
        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referrerCode = document.getElementById('referrerCode').value.trim();
            const agreement = document.getElementById('agreement').checked;
            const registerBtn = document.getElementById('registerBtn');
            
            if (!username) {
                showError('请输入用户名');
                return;
            }
            
            if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(username)) {
                showError('用户名必须以字母开头，只能包含字母、数字和下划线');
                return;
            }
            
            if (username.length < 3 || username.length > 20) {
                showError('用户名长度需在3-20个字符之间');
                return;
            }
            
            if (!password) {
                showError('请输入密码');
                return;
            }
            
            if (password.length < 6) {
                showError('密码至少需要6个字符');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }
            
            if (!agreement) {
                showError('请阅读并同意用户协议');
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span>注册中...';
            
            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email || null,
                        phone: phone || null,
                        password: password,
                        referrer_code: referrerCode || null
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showSuccess('注册成功！正在跳转到登录页面...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showError(result.detail || '注册失败，请稍后重试');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '注 册';
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('网络错误，请稍后重试');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '注 册';
            }
        });
    </script>
</body>
</html>
