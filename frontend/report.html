        function downloadPDF() {
            const token = localStorage.getItem('token');
            let reportId = localStorage.getItem('viewReportId');
            
            if (!token) {
                alert('请先登录');
                return;
            }
            
            if (!reportId) {
                const reportDataStr = localStorage.getItem('reportData');
                if (reportDataStr) {
                    try {
                        const reportData = JSON.parse(reportDataStr);
                        if (reportData.report_id) {
                            reportId = reportData.report_id.replace('DA-', '');
                        } else if (reportData.id) {
                            reportId = reportData.id;
                        }
                    } catch(e) {
                        console.error('解析报告数据失败:', e);
                    }
                }
            }
            
            if (!reportId) {
                alert('无法获取报告信息，请从历史报告页面重新进�?);
                return;
            }
            
            fetch(`/api/v1/evaluation/${reportId}/download`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(function(response) {
                console.log('Response status:', response.status);
                if (response.status === 403) {
                    return response.json().then(function(data) {
                        alert(data.detail?.message || '该功能仅限VIP用户使用');
                    });
                }
                if (response.status === 500) {
                    return response.text().then(function(text) {
                        console.error('Server error response:', text);
                        alert('服务器错误：PDF生成失败，请联系管理�?);
                    });
                }
                if (!response.ok) {
                    return response.text().then(function(text) {
                        console.error('Error response:', text);
                        throw new Error('下载失败: ' + response.status);
                    });
                }
                return response.blob().then(function(blob) {
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = `数据资产评估报告_ID${reportId}.pdf`;
                    if (contentDisposition) {
                        let match = contentDisposition.match(/filename\*="?UTF-8''([^"]+)"?/i);
                        if (match && match[1]) {
                            filename = decodeURIComponent(match[1]);
                        } else {
                            match = contentDisposition.match(/filename="?([^"]+)"?/);
                            if (match && match[1]) {
                                filename = match[1];
                            }
                        }
                    }
                    return { blob: blob, filename: filename };
                });
            })
            .then(function(result) {
                if (result && result.blob && result.blob.size > 0) {
                    const url = window.URL.createObjectURL(result.blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = result.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else if (result && result.blob) {
                    alert('下载失败：文件为�?);
                }
            })
            .catch(function(error) {
                console.error('PDF下载失败:', error);
                alert('下载失败�? + error.message);
            });
        }

        async function checkVipStatus() {
            const token = localStorage.getItem('token');

                if (response.ok) {
                    const result = await response.json();

                    if (user.is_vip) {
                        // VIP用户显示导出按钮
