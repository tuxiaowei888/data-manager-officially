<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B3A57;
            --primary-dark: #0F4C81;
            --primary-light: #2E5A7C;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: #E8EDF2;
            --gradient-brand: linear-gradient(135deg, #1B3A57 0%, #00D2FF 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family-zh);
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 0;
        }
        
        .page-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-brand);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-tech);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-info {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .vip-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #FF9F43 0%, #F7931A 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .logout-btn {
            background: none;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .logout-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        
        .welcome-section {
            background: var(--gradient-brand);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            color: white;
        }

        .welcome-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 210, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.8;
        }

        .welcome-section::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.3) 0%, transparent 70%);
            animation: welcomeGlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes welcomeGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .welcome-grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            height: 1px;
            width: 100%;
            left: 0;
        }

        .welcome-grid-line.line-1 { top: 25%; animation: gridScan 3s linear infinite; }
        .welcome-grid-line.line-2 { top: 50%; animation: gridScan 3s linear infinite 1s; }
        .welcome-grid-line.line-3 { top: 75%; animation: gridScan 3s linear infinite 2s; }

        @keyframes gridScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        
        .welcome-subtitle {
            font-size: 15px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .welcome-stats {
            display: flex;
            gap: 40px;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }
        
        .welcome-stat {
            text-align: center;
        }
        
        .welcome-stat-value {
            font-size: 32px;
            font-weight: 700;
            font-family: var(--font-family-num);
        }
        
        .welcome-stat-label {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title i {
            color: var(--tech-accent);
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .action-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            border-color: var(--tech-accent);
        }
        
        .action-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }
        
        .action-icon.primary {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15) 0%, rgba(78, 205, 196, 0.15) 100%);
            color: var(--tech-accent);
        }
        
        .action-icon.secondary {
            background: linear-gradient(135deg, rgba(27, 58, 87, 0.1) 0%, rgba(46, 90, 124, 0.1) 100%);
            color: var(--primary-color);
        }
        
        .action-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .action-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title i {
            color: var(--tech-accent);
        }
        
        .card-body {
            padding: 24px;
        }
        
        .report-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .report-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .report-item:last-child {
            border-bottom: none;
        }
        
        .report-item:hover {
            background: var(--bg-primary);
            margin: 0 -24px;
            padding: 16px 24px;
        }
        
        .report-score {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            font-family: var(--font-family-num);
            margin-right: 16px;
        }
        
        .report-score.high {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success-color);
        }
        
        .report-score.medium {
            background: rgba(255, 159, 67, 0.1);
            color: var(--warning-color);
        }
        
        .report-score.low {
            background: rgba(255, 107, 107, 0.1);
            color: var(--danger-color);
        }
        
        .report-info {
            flex: 1;
        }
        
        .report-name {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .report-date {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .report-arrow {
            color: var(--text-disabled);
            font-size: 18px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--text-disabled);
            margin-bottom: 16px;
        }
        
        .empty-state p {
            margin-bottom: 16px;
        }
        
        .vip-card {
            background: linear-gradient(135deg, #FF9F43 0%, #F7931A 100%);
            color: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        
        .vip-card.upgrade {
            background: linear-gradient(135deg, #1B3A57 0%, #2E5A7C 100%);
        }
        
        .vip-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }
        
        .vip-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .vip-desc {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
        }
        
        .vip-features {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .vip-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 14px;
        }
        
        .vip-feature i {
            color: var(--tech-accent);
        }
        
        .btn-upgrade {
            background: white;
            color: var(--primary-color);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-upgrade:hover {
            transform: scale(1.05);
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            font-family: var(--font-family-num);
            margin-bottom: 8px;
        }
        
        .stat-value.accent {
            color: var(--tech-accent);
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .view-all-link {
            font-size: 14px;
            color: var(--tech-accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .view-all-link:hover {
            color: var(--primary-color);
        }
        
        @media (max-width: 768px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }
            
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .welcome-stats {
                flex-wrap: wrap;
                gap: 20px;
            }
            
            .welcome-section {
                padding: 24px;
            }
            
            .welcome-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="bi bi-bar-chart-line"></i>
                </div>
                <span class="logo-text">数维数据管家</span>
            </div>
            <div class="user-section">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <span class="user-name" id="userName">用户</span>
                    <span class="vip-badge" id="vipBadge" style="display: none;">
                        <i class="bi bi-star-fill"></i> VIP
                    </span>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </button>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="welcome-section">
            <div class="welcome-grid-line line-1"></div>
            <div class="welcome-grid-line line-2"></div>
            <div class="welcome-grid-line line-3"></div>
            <h1 class="welcome-title" id="welcomeTitle">欢迎回来</h1>
            <p class="welcome-subtitle">开始您的数据资产评估之旅，解锁数据价值</p>
            <div class="welcome-stats">
                <div class="welcome-stat">
                    <div class="welcome-stat-value" id="totalReports" data-target="0">0</div>
                    <div class="welcome-stat-label">评估报告</div>
                </div>
                <div class="welcome-stat">
                    <div class="welcome-stat-value" id="avgScore" data-target="0">-</div>
                    <div class="welcome-stat-label">平均得分</div>
                </div>
                <div class="welcome-stat">
                    <div class="welcome-stat-value" id="remainingCount" data-target="0">-</div>
                    <div class="welcome-stat-label">剩余评估次数</div>
                </div>
            </div>
        </div>
        
        <div class="quick-actions">
            <a href="/survey" class="action-card">
                <div class="action-icon primary">
                    <i class="bi bi-plus-circle"></i>
                </div>
                <div class="action-title">开始新评估</div>
                <div class="action-desc">填写调研表单，获取数据资产成熟度评估报告</div>
            </a>
            <a href="/history" class="action-card">
                <div class="action-icon secondary">
                    <i class="bi bi-clock-history"></i>
                </div>
                <div class="action-title">历史报告</div>
                <div class="action-desc">查看和管理您的所有评估报告</div>
            </a>
        </div>
        
        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-file-earmark-text"></i>
                        最近报告
                    </div>
                    <a href="/history" class="view-all-link">
                        查看全部 <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
                <div class="card-body">
                    <ul class="report-list" id="reportList">
                        <li class="empty-state">
                            <i class="bi bi-clipboard-data"></i>
                            <p>暂无评估报告</p>
                            <a href="/survey" class="btn btn-primary btn-sm">开始评估</a>
                        </li>
                    </ul>
                </div>
            </div>
            
            <div>
                <div class="card" id="vipCard">
                    <div class="card-body">
                        <div class="vip-card" id="vipCardContent">
                            <div class="vip-icon">
                                <i class="bi bi-star-fill"></i>
                            </div>
                            <div class="vip-title" id="vipTitle">VIP会员</div>
                            <div class="vip-desc" id="vipDesc">享受无限评估、报告永久保存等特权</div>
                            <div class="vip-features" id="vipFeatures">
                                <div class="vip-feature">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>无限次评估</span>
                                </div>
                                <div class="vip-feature">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>报告永久保存</span>
                                </div>
                                <div class="vip-feature">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>PDF报告导出</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token || !userInfo) {
                window.location.href = '/login';
                return;
            }
            
            currentUser = JSON.parse(userInfo);
            
            // 管理员跳转到管理后台
            if (currentUser.user_type === 'admin') {
                window.location.href = '/admin';
                return;
            }
            
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            
            // 显示VIP徽章
            if (currentUser.is_vip) {
                document.getElementById('vipBadge').style.display = 'inline-flex';
            }
            
            // 加载数据
            loadDashboardData();
            refreshUserInfo();
        }
        
        async function refreshUserInfo() {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    currentUser = result.data;
                    localStorage.setItem('userInfo', JSON.stringify(currentUser));
                    
                    // 更新VIP徽章
                    if (currentUser.is_vip) {
                        document.getElementById('vipBadge').style.display = 'inline-flex';
                    } else {
                        document.getElementById('vipBadge').style.display = 'none';
                    }
                    
                    updateVipCard();
                }
            } catch(e) {
                console.error('刷新用户信息失败:', e);
            }
        }
        
        async function loadDashboardData() {
            const token = localStorage.getItem('token');
            
            try {
                // 获取评估次数状态
                const vipStatusResponse = await fetch('/api/v1/evaluation/vip-status', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (vipStatusResponse.ok) {
                    const vipStatus = await vipStatusResponse.json();
                    const remaining = vipStatus.is_vip ? '无限' : vipStatus.remaining;
                    document.getElementById('remainingCount').textContent = remaining;
                }
                
                // 获取历史报告
                const historyResponse = await fetch(`/api/v1/evaluation/user/${currentUser.id}/history?limit=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (historyResponse.ok) {
                    const reports = await historyResponse.json();
                    updateReportList(reports);
                    updateStats(reports);
                }
            } catch(e) {
                console.error('加载数据失败:', e);
            }
        }
        
        function updateReportList(reports) {
            const listContainer = document.getElementById('reportList');
            
            if (reports.length === 0) {
                listContainer.innerHTML = `
                    <li class="empty-state">
                        <i class="bi bi-clipboard-data"></i>
                        <p>暂无评估报告</p>
                        <a href="/survey" class="btn btn-primary btn-sm">开始评估</a>
                    </li>
                `;
                return;
            }
            
            listContainer.innerHTML = reports.map(report => {
                const scoreClass = report.total_score >= 75 ? 'high' : report.total_score >= 60 ? 'medium' : 'low';
                return `
                    <li class="report-item" onclick="viewReport(${report.id})">
                        <div class="report-score ${scoreClass}">${Math.round(report.total_score)}</div>
                        <div class="report-info">
                            <div class="report-name">${report.org_name || '未命名企业'}</div>
                            <div class="report-date">${report.created_at || '-'}</div>
                        </div>
                        <i class="bi bi-chevron-right report-arrow"></i>
                    </li>
                `;
            }).join('');
        }
        
        function animateNumber(element, target) {
            const duration = 1500;
            const start = 0;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(start + (target - start) * easeOut);
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        }
        
        function updateStats(reports) {
            const totalReportsEl = document.getElementById('totalReports');
            const avgScoreEl = document.getElementById('avgScore');
            const remainingCountEl = document.getElementById('remainingCount');
            
            animateNumber(totalReportsEl, reports.length);
            
            if (reports.length > 0) {
                const avgScore = reports.reduce((sum, r) => sum + r.total_score, 0) / reports.length;
                animateNumber(avgScoreEl, Math.round(avgScore));
            }
            
            if (currentUser.remaining_count !== undefined) {
                animateNumber(remainingCountEl, currentUser.remaining_count);
            }
        }
        
        function updateVipCard() {
            const vipCard = document.getElementById('vipCardContent');
            const vipTitle = document.getElementById('vipTitle');
            const vipDesc = document.getElementById('vipDesc');
            const vipFeatures = document.getElementById('vipFeatures');
            
            if (currentUser.is_vip) {
                vipCard.classList.remove('upgrade');
                vipTitle.textContent = 'VIP会员';
                vipDesc.textContent = '您正在享受VIP专属权益';
                vipFeatures.innerHTML = `
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>无限次评估</span>
                    </div>
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>报告永久保存</span>
                    </div>
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>PDF报告导出</span>
                    </div>
                `;
            } else {
                vipCard.classList.add('upgrade');
                vipTitle.textContent = '升级VIP';
                vipDesc.textContent = '解锁更多专属权益';
                vipFeatures.innerHTML = `
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>无限次评估</span>
                    </div>
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>报告永久保存</span>
                    </div>
                    <div class="vip-feature">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>PDF报告导出</span>
                    </div>
                `;
            }
        }
        
        function viewReport(id) {
            localStorage.setItem('viewReportId', id);
            window.location.href = '/report';
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            localStorage.removeItem('reportData');
            window.location.href = '/login';
        }
    </script>
