<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 历史报告</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B3A57;
            --primary-dark: #0F4C81;
            --primary-light: #2E5A7C;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: #E8EDF2;
            --gradient-brand: linear-gradient(135deg, #1B3A57 0%, #00D2FF 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family-zh);
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .header-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }
        
        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-brand);
        }
        
        .header-title {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 4px;
        }
        
        .header-title i {
            color: var(--tech-accent);
            margin-right: 10px;
        }
        
        .header-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-brand);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .user-name {
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .vip-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #FF9F43 0%, #F7931A 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .vip-badge i {
            font-size: 10px;
        }
        
        .logout-btn {
            background: none;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }
        
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        
        .stat-value {
            font-family: var(--font-family-num);
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }
        
        .stat-value.tech {
            color: var(--tech-accent);
        }
        
        .stat-value.success {
            color: var(--success-color);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .content-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .btn-new {
            background: var(--gradient-brand);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(27, 58, 87, 0.3);
            color: white;
        }
        
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .report-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-primary);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .report-item:hover {
            border-color: var(--tech-accent);
            background: rgba(0, 210, 255, 0.03);
        }
        
        .report-score {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family-num);
            font-size: 18px;
            font-weight: 700;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        .report-score.high {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success-color);
        }
        
        .report-score.medium {
            background: rgba(255, 159, 67, 0.15);
            color: var(--warning-color);
        }
        
        .report-score.low {
            background: rgba(255, 107, 107, 0.15);
            color: var(--danger-color);
        }
        
        .report-info {
            flex: 1;
        }
        
        .report-org {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .report-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
        }
        
        .report-meta i {
            margin-right: 4px;
        }
        
        .report-level {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .report-level.a {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success-color);
        }
        
        .report-level.b {
            background: rgba(0, 210, 255, 0.15);
            color: var(--tech-accent);
        }
        
        .report-level.c {
            background: rgba(255, 159, 67, 0.15);
            color: var(--warning-color);
        }
        
        .report-level.d {
            background: rgba(255, 107, 107, 0.15);
            color: var(--danger-color);
        }
        
        .report-actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }
        
        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-action:hover {
            border-color: var(--tech-accent);
            color: var(--tech-accent);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 64px;
            color: var(--text-disabled);
            margin-bottom: 20px;
            opacity: 0.6;
        }
        
        .empty-state h3 {
            color: var(--text-primary);
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        
        .empty-state .btn-new {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            font-size: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1B3A57 0%, #2d5a7b 100%);
            box-shadow: 0 4px 20px rgba(27, 58, 87, 0.25);
        }
        
        .empty-state .btn-new i {
            font-size: 18px;
            color: white;
            opacity: 1;
            margin-bottom: 0;
        }
        
        .empty-state .btn-new:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 24px rgba(27, 58, 87, 0.35);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-light);
            border-radius: 50%;
            border-top-color: var(--tech-accent);
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        
        @media (max-width: 768px) {
            .stats-row {
                flex-direction: column;
            }
            
            .header-section {
                padding: 16px 20px;
            }
            
            .report-item {
                flex-wrap: wrap;
            }
            
            .report-actions {
                width: 100%;
                margin-left: 0;
                margin-top: 12px;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <div class="header-section">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="header-title">
                        <i class="bi bi-clock-history"></i>历史报告
                    </h1>
                    <p class="header-subtitle">查看和管理您的数据资产评估报�?/p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <span class="user-name" id="userName">用户</span>
                        <span class="vip-badge" id="vipBadge" style="display: none;">
                            <i class="bi bi-star-fill"></i> VIP
                        </span>
                    </div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> 退�?                    </button>
                </div>
            </div>
        </div>
        
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-value" id="totalReports">0</div>
                <div class="stat-label">评估总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value tech" id="avgScore">-</div>
                <div class="stat-label">平均得分</div>
            </div>
            <div class="stat-card">
                <div class="stat-value success" id="bestScore">-</div>
                <div class="stat-label">最高得�?/div>
            </div>
        </div>
        
        <div class="content-card">
            <div class="section-header">
                <span class="section-title">报告列表</span>
                <a href="/survey.html" class="btn-new">
                    <i class="bi bi-plus-lg"></i> 新建评估
                </a>
            </div>
            
            <div id="reportList" class="report-list">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token || !userInfo) {
                window.location.href = '/login';
                return false;
            }
            
            currentUser = JSON.parse(userInfo);
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            
            // 显示VIP徽章
            if (currentUser.is_vip) {
                document.getElementById('vipBadge').style.display = 'inline-flex';
            }
            
            // 异步刷新用户信息
            refreshUserInfo();
            
            return true;
        }
        
        async function refreshUserInfo() {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    currentUser = result.data;
                    localStorage.setItem('userInfo', JSON.stringify(currentUser));
                    
                    // 更新VIP徽章显示
                    if (currentUser.is_vip) {
                        document.getElementById('vipBadge').style.display = 'inline-flex';
                    } else {
                        document.getElementById('vipBadge').style.display = 'none';
                    }
                }
            } catch(e) {
                console.error('刷新用户信息失败:', e);
            }
        }
        
        async function loadReports() {
            const token = localStorage.getItem('token');
            const listContainer = document.getElementById('reportList');
            
            try {
                const response = await fetch(`/api/v1/evaluation/user/${currentUser.id}/history?limit=20`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('获取报告列表失败');
                }
                
                const reports = await response.json();
                
                if (reports.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-clipboard-data"></i>
                            <h3>暂无评估报告</h3>
                            <p>完成调研表单后，系统将自动生成评估报�?/p>
                            <a href="/survey.html" class="btn-new">
                                <i class="bi bi-plus-circle"></i> 开始评�?                            </a>
                        </div>
                    `;
                    return;
                }
                
                updateStats(reports);
                renderReports(reports);
                
            } catch (error) {
                console.error('加载报告失败:', error);
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-triangle"></i>
                        <h3>加载失败</h3>
                        <p>请检查网络连接后重试</p>
                    </div>
                `;
            }
        }
        
        function updateStats(reports) {
            document.getElementById('totalReports').textContent = reports.length;
            
            const scores = reports.map(r => r.total_score);
            const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
            const best = Math.max(...scores);
            
            document.getElementById('avgScore').textContent = avg.toFixed(1);
            document.getElementById('bestScore').textContent = best.toFixed(1);
        }
        
        function renderReports(reports) {
            const listContainer = document.getElementById('reportList');
            
            listContainer.innerHTML = reports.map(report => {
                const score = report.total_score;
                const level = getLevel(score);
                const scoreClass = score >= 75 ? 'high' : (score >= 60 ? 'medium' : 'low');
                
                return `
                    <div class="report-item" onclick="viewReport(${report.id})">
                        <div class="report-score ${scoreClass}">${score.toFixed(0)}</div>
                        <div class="report-info">
                            <div class="report-org">${report.org_name || '未命名企�?}</div>
                            <div class="report-meta">
                                <span><i class="bi bi-calendar"></i> ${report.created_at || '-'}</span>
                                <span><i class="bi bi-shield-check"></i> ${report.risk_level}</span>
                            </div>
                        </div>
                        <span class="report-level ${level.class}">${level.text}</span>
                        <div class="report-actions">
                            <button class="btn-action" onclick="event.stopPropagation(); viewReport(${report.id})" title="查看详情">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn-action" onclick="event.stopPropagation(); downloadReport(${report.id})" title="下载报告">
                                <i class="bi bi-download"></i>
                            </button>
                            <button class="btn-action" onclick="event.stopPropagation(); deleteReport(${report.id})" title="删除">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getLevel(score) {
            if (score >= 90) return { text: 'A�?, class: 'a' };
            if (score >= 75) return { text: 'B�?, class: 'b' };
            if (score >= 60) return { text: 'C�?, class: 'c' };
            return { text: 'D�?, class: 'd' };
        }
        
        function viewReport(id) {
            localStorage.setItem('viewReportId', id);
            window.location.href = '/report';
        }
        
        async function downloadReport(id) {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            
            // 检查VIP状�?            if (userInfo) {
                const user = JSON.parse(userInfo);
                if (!user.is_vip) {
                    alert('该功能仅限VIP用户使用，请升级VIP后重�?);
                    return;
                }
            }
            
            try {
                const response = await fetch(`/api/v1/evaluation/${id}/download`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.status === 403) {
                    const error = await response.json();
                    alert(error.detail?.message || '该功能仅限VIP用户使用');
                    return;
                }
                
                if (response.status === 404) {
                    alert('报告不存�?);
                    return;
                }
                
                if (response.status === 500) {
                    const errorText = await response.text();
                    console.error('Server error response:', errorText);
                    alert('PDF生成失败：服务器错误');
                    return;
                }
                
                if (!response.ok) {
                    const errorText = await response.text();
                    alert('下载失败�? + response.status + ' ' + errorText);
                    return;
                }
                
                const blob = await response.blob();
                
                if (blob.size === 0) {
                    alert('下载失败：文件为�?);
                    return;
                }
                
                // 从响应头获取文件�?                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `report_${id}.pdf`;
                if (contentDisposition) {
                    // 尝试多种格式匹配
                    let match = contentDisposition.match(/filename\*="?UTF-8''([^"]+)"?/i);
                    if (match && match[1]) {
                        filename = decodeURIComponent(match[1]);
                    } else {
                        match = contentDisposition.match(/filename="?([^"]+)"?/);
                        if (match && match[1]) {
                            filename = match[1];
                        }
                    }
                }
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
            } catch (error) {
                console.error('下载错误:', error);
                alert('下载失败�? + error.message);
            }
        }
        
        async function deleteReport(id) {
            if (!confirm('确定要删除这份报告吗？此操作不可恢复�?)) {
                return;
            }
            
            alert('删除功能开发中...');
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            window.location.href = '/login';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadReports();
            }
        });
    </script>
</body>
</html>
