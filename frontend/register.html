<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 注册</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css?v=2" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0B1120;
            --primary-dark: #0a0f1e;
            --primary-light: #1B3A57;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #0B1120;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: rgba(0, 210, 255, 0.2);
            --gradient-brand: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1a2744 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-zh);
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .register-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .brand-section {
            flex: 1;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(0, 210, 255, 0.15);
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.08) 0%, transparent 40%);
        }

        .brand-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.7) 0%, rgba(15, 23, 42, 0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .brand-glow {
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, transparent 70%);
            animation: brandGlow 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .brand-grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            height: 1px;
            width: 100%;
            left: 0;
            animation: gridScan 4s linear infinite;
            z-index: 3;
        }

        .brand-grid-line.line-1 { top: 20%; animation-delay: 0s; }
        .brand-grid-line.line-2 { top: 40%; animation-delay: 1s; }
        .brand-grid-line.line-3 { top: 60%; animation-delay: 2s; }
        .brand-grid-line.line-4 { top: 80%; animation-delay: 3s; }

        @keyframes gridScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .brand-floating {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floating 6s ease-in-out infinite;
            z-index: 3;
        }

        .brand-floating:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .brand-floating:nth-child(2) { top: 25%; right: 25%; animation-delay: 1s; }
        .brand-floating:nth-child(3) { top: 60%; left: 15%; animation-delay: 2s; }
        .brand-floating:nth-child(4) { top: 70%; right: 20%; animation-delay: 3s; }
        .brand-floating:nth-child(5) { top: 85%; left: 30%; animation-delay: 4s; }

        @keyframes floating {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 480px;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2) 0%, rgba(78, 205, 196, 0.1) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        .brand-logo i {
            font-size: 40px;
            color: #00D2FF;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.5));
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-steps {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .step-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .step-number {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .step-desc {
            font-size: 13px;
            opacity: 0.8;
        }

        .form-section {
            width: 560px;
            min-width: 560px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 40px 70px;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid rgba(0, 210, 255, 0.2);
            overflow-y: auto;
            position: relative;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .form-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 6px;
        }

        .form-label .required {
            color: var(--danger-color);
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tech-accent);
            font-size: 18px;
            transition: all 0.25s ease;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid rgba(0, 210, 255, 0.25);
            border-radius: 10px;
            font-size: 14px;
            color: white;
            transition: all 0.25s ease;
            background: rgba(0, 210, 255, 0.08);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--tech-accent);
            background: rgba(0, 210, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.2), 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: var(--tech-accent);
            opacity: 1;
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--tech-accent);
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(0, 210, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: var(--danger-color);
        }

        .password-strength-bar.medium {
            width: 66%;
            background: var(--warning-color);
        }

        .password-strength-bar.strong {
            width: 100%;
            background: var(--success-color);
        }

        .password-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .form-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .form-check-input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: var(--tech-accent);
        }

        .form-check-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        .form-check-label a {
            color: var(--tech-accent);
            text-decoration: none;
        }

        .form-check-label a:hover {
            text-decoration: underline;
        }

        .btn-register {
            width: 100%;
            padding: 16px 24px;
            background: transparent;
            color: var(--tech-accent);
            border: 2px solid var(--tech-accent);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: var(--tech-accent);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .btn-register:hover::before {
            width: 100%;
        }

        .btn-register:hover {
            color: var(--primary-dark);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            border-color: rgba(0, 210, 255, 0.3);
            color: rgba(0, 210, 255, 0.5);
        }

        .btn-register:disabled::before {
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 210, 255, 0.15);
        }

        .divider span {
            padding: 0 16px;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .login-link a {
            color: var(--tech-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            color: var(--tech-secondary);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-danger {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-section {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .form-section {
            transition: all 0.4s ease;
        }

        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }

            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 520px;
                margin: 0 auto;
                padding: 40px;
                max-height: 100vh;
                justify-content: flex-start;
            }

            .register-wrapper {
                justify-content: center;
                overflow-y: auto;
            }
        }

        @media (max-width: 600px) {
            .form-section {
                padding: 30px 24px;
                max-width: 100%;
                margin: 0;
                border-radius: 0;
            }

            .form-title {
                font-size: 22px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="register-wrapper">
        <div class="brand-section">
            <div class="brand-bg-overlay"></div>
            <div class="brand-glow"></div>
            <div class="brand-grid-line line-1"></div>
            <div class="brand-grid-line line-2"></div>
            <div class="brand-grid-line line-3"></div>
            <div class="brand-grid-line line-4"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">让数据价值看得见、可量化、能变现<br>开启数据资产化智能评估之旅</p>

                <div class="brand-steps">
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">注册账号</div>
                            <div class="step-desc">填写基本信息，创建您的专属账号</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">填写调研表单</div>
                            <div class="step-desc">回答数据资产相关问题，系统自动分析</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">获取评估报告</div>
                            <div class="step-desc">一键生成专业报告，支持下载与分享</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">创建账号</h2>
                <p class="form-desc">填写以下信息完成注册</p>
            </div>

            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">用户名<span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="3-20个字符，字母开头" required minlength="3" maxlength="20" pattern="^[a-zA-Z][a-zA-Z0-9_]*$" autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <div class="input-wrapper">
                            <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" autocomplete="email">
                            <i class="bi bi-envelope"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <div class="input-wrapper">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="11位手机号" pattern="[0-9]{11}" autocomplete="tel">
                            <i class="bi bi-phone"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">密码 <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('password', 'eyeIcon1')">
                            <i class="bi bi-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">密码强度：未输入</div>
                </div>

                <div class="form-group">
                    <label class="form-label">确认密码 <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
                        <i class="bi bi-lock-fill"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                            <i class="bi bi-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">推荐码（选填）</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="referrerCode" name="referrerCode" placeholder="如有推荐码请填写">
                        <i class="bi bi-gift"></i>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="agreement" name="agreement" required>
                    <label class="form-check-label" for="agreement">
                        我已阅读并同意<a href="#">《用户服务协议》</a> 及<a href="#">《隐私政策》</a>
                    </label>
                </div>

                <button type="submit" class="btn-register" id="registerBtn">注 册</button>
            </form>

            <div class="divider">
                <span>已有账号？</span>
            </div>

            <div class="login-link">
                <a href="/login.html">立即登录</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="ui-particles-simple.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing particle background...');
            const particles = initParticleBackground('particles-canvas', {
                particleColor: '0, 210, 255',
                particleCount: 150,
                lineDistance: 250,
                particleRadius: 4,
                speed: 1.2,
                lineOpacity: 0.5,
                particleOpacity: 1,
                flowSpeed: 3
            });
            console.log('Particle background initialized:', particles);
        });

        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }

        function checkPasswordStrength(password) {
            const bar = document.getElementById('passwordStrengthBar');
            const hint = document.getElementById('passwordHint');

            bar.classList.remove('weak', 'medium', 'strong');

            if (!password) {
                bar.style.width = '0';
                hint.textContent = '密码强度：未输入';
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            if (strength <= 2) {
                bar.classList.add('weak');
                hint.textContent = '密码强度：弱';
            } else if (strength <= 4) {
                bar.classList.add('medium');
                hint.textContent = '密码强度：中';
            } else {
                bar.classList.add('strong');
                hint.textContent = '密码强度：强';
            }
        }

        document.getElementById('password').addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referrerCode = document.getElementById('referrerCode').value.trim();
            const agreement = document.getElementById('agreement').checked;
            const registerBtn = document.getElementById('registerBtn');

            if (!username) {
                showError('请输入用户名');
                return;
            }

            if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(username)) {
                showError('用户名必须以字母开头，只能包含字母、数字和下划线');
                return;
            }

            if (username.length < 3 || username.length > 20) {
                showError('用户名长度需为3-20个字符之间');
                return;
            }

            if (!password) {
                showError('请输入密码');
                return;
            }

            if (password.length < 6) {
                showError('密码至少需6个字符');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            if (!agreement) {
                showError('请阅读并同意用户协议');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span>注册中...';

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email || null,
                        phone: phone || null,
                        password: password,
                        referrer_code: referrerCode || null
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('注册成功！正在跳转到登录页面...');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    showError(result.detail || '注册失败，请稍后重试');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '注 册';
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('网络错误，请稍后重试');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '注 册';
            }
        });
    </script>
</body>
</html>
