<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 登录</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css?v=2" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0B1120;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-dark: #0a0f1e;
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-zh);
            background: #0a0f1e;
            min-height: 100vh;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .brand-section {
            flex: 1.2;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
        }

        .brand-section::before {
            display: none;
        }

        .brand-section > * {
            position: relative;
            z-index: 2;
        }

        .brand-glow {
            position: absolute;
            top: -30%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(78, 205, 196, 0.15) 40%, transparent 70%);
            animation: brandGlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 500px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3) 0%, rgba(78, 205, 196, 0.2) 100%);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.3), inset 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .brand-logo i {
            font-size: 44px;
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d2ff, #4ecdc4, #00d2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 3s linear infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .brand-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-features {
            text-align: left;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 28px 32px;
            backdrop-filter: blur(10px);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(78, 205, 196, 0.2));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon i {
            font-size: 20px;
            color: #00d2ff;
        }

        .feature-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
        }

        .feature-text strong {
            display: block;
            font-size: 15px;
            margin-bottom: 3px;
            color: #fff;
        }

        .form-section {
            width: 480px;
            min-width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 60px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 210, 255, 0.15);
            position: relative;
        }

        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d2ff, #4ecdc4, transparent);
            opacity: 0.6;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .form-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d2ff;
            font-size: 18px;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: all 0.2s ease;
            background-color: rgba(10, 15, 30, 0.8) !important;
            background-image: none !important;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d2ff;
            background-color: rgba(10, 15, 30, 0.95) !important;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2), 0 0 25px rgba(0, 210, 255, 0.25);
        }

        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px rgba(10, 15, 30, 0.95) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: #00d2ff;
            opacity: 1;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4) !important;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00d2ff;
        }

        .form-check-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: #00d2ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #4ecdc4;
        }

        button.btn-login,
        input[type="submit"].btn-login {
            width: 100% !important;
            padding: 16px 24px !important;
            background: transparent !important;
            color: #00d2ff !important;
            border: 2px solid #00d2ff !important;
            border-radius: 12px !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
            position: relative !important;
            overflow: hidden !important;
            -webkit-appearance: none !important;
            appearance: none !important;
        }

        button.btn-login::before,
        input[type="submit"].btn-login::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 0 !important;
            height: 100% !important;
            background: #00d2ff !important;
            transition: width 0.3s ease !important;
            z-index: -1 !important;
        }

        button.btn-login:hover::before,
        input[type="submit"].btn-login:hover::before {
            width: 100% !important;
        }

        button.btn-login:hover,
        input[type="submit"].btn-login:hover {
            color: #0a0f1e !important;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5) !important;
            transform: translateY(-2px) !important;
        }

        button.btn-login:active,
        input[type="submit"].btn-login:active {
            transform: translateY(0) !important;
        }

        button.btn-login:disabled,
        input[type="submit"].btn-login:disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            transform: none !important;
            border-color: rgba(0, 210, 255, 0.3) !important;
            color: rgba(0, 210, 255, 0.5) !important;
        }

        button.btn-login:disabled::before,
        input[type="submit"].btn-login:disabled::before {
            display: none !important;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 210, 255, 0.15);
        }

        .divider span {
            padding: 0 16px;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #4ecdc4;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-danger {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #00d2ff;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #0a0f1e;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .guest-link {
            text-align: center;
            margin-top: 16px;
        }

        .guest-link a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .guest-link a:hover {
            color: #00d2ff;
        }

        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }

            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 480px;
                margin: 0 auto;
                padding: 40px;
            }
        }

        @media (max-width: 480px) {
            .form-section {
                padding: 30px 24px;
            }

            .form-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="login-wrapper">
        <div class="brand-section">
            <div class="brand-glow"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">数据要素资产化智能评估平台<br>让数据价值看得见、可量化、能变现</p>

                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-clipboard-data"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数据资产深度调研</strong>
                            6大维度全面采集企业信息，精准画像
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-cpu"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数维·智规融合评估</strong>
                            规则+知识+AI三位一体智能诊断
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-phone"></i>
                        </div>
                        <div class="feature-text">
                            <strong>双端一体化加持</strong>
                            Web+小程序双端联动，数据随时可查
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">账号登录</h2>
                <p class="form-desc">欢迎使用数维·数据资产管家平台</p>
            </div>

            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">登 录</button>
            </form>

            <div class="divider">
                <span>还没有账号？</span>
            </div>

            <div class="register-link">
                <a href="/register.html">立即注册</a>，开启数据资产化之旅       
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        const config = {
            particleCount: 80,
            particleRadius: 4,
            lineDistance: 200,
            particleColor: '0, 210, 255',
            bgColor: '#0d1321'
        };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 3 + 2;
                this.glow = Math.random() * 15 + 10;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${config.particleColor}, 0.8)`;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = `rgba(${config.particleColor}, 0.6)`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.lineDistance) {
                        const opacity = (1 - distance / config.lineDistance) * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(${config.particleColor}, ${opacity})`;
                        ctx.lineWidth = 1.5;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = `rgba(${config.particleColor}, 0.5)`;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function drawGrid() {
            const gridSize = 60;

            ctx.strokeStyle = 'rgba(0, 210, 255, 0.08)';
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function animate() {
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, width, height);

            drawGrid();
            drawConnections();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        function initParticles() {
            resize();
            particles = [];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        window.addEventListener('resize', resize);
        initParticles();

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        function redirectByUserType(userType) {
            if (userType === 'admin') {
                window.location.href = '/admin-new';
            } else {
                window.location.href = '/home';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('请填写用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.access_token);

                    const userType = result.user_type || 'client';
                    localStorage.setItem('userInfo', JSON.stringify({
                        username: result.username || username,
                        user_type: userType
                    }));

                    redirectByUserType(userType);
                } else {
                    showError(result.detail || '登录失败，请检查用户名和密码');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }
        });
    </script>
</body>
</html>
