<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 登录</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css?v=2" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0B1120;
            --primary-dark: #0a0f1e;
            --primary-light: #1B3A57;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #0B1120;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: rgba(0, 210, 255, 0.2);
            --gradient-brand: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1a2744 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-zh);
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .brand-section {
            flex: 1;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(0, 210, 255, 0.15);
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.08) 0%, transparent 40%);
        }

        .brand-section .brand-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.7) 0%, rgba(15, 23, 42, 0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .brand-section .brand-glow {
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, transparent 70%);
            animation: brandGlow 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .brand-grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            height: 1px;
            width: 100%;
            left: 0;
            animation: gridScan 4s linear infinite;
            z-index: 3;
        }

        .brand-grid-line.line-1 { top: 20%; animation-delay: 0s; }
        .brand-grid-line.line-2 { top: 40%; animation-delay: 1s; }
        .brand-grid-line.line-3 { top: 60%; animation-delay: 2s; }
        .brand-grid-line.line-4 { top: 80%; animation-delay: 3s; }

        @keyframes gridScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .brand-floating {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floating 6s ease-in-out infinite;
            z-index: 3;
        }

        .brand-floating:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .brand-floating:nth-child(2) { top: 25%; right: 25%; animation-delay: 1s; }
        .brand-floating:nth-child(3) { top: 60%; left: 15%; animation-delay: 2s; }
        .brand-floating:nth-child(4) { top: 70%; right: 20%; animation-delay: 3s; }
        .brand-floating:nth-child(5) { top: 85%; left: 30%; animation-delay: 4s; }

        @keyframes floating {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 480px;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .brand-logo i {
            font-size: 40px;
            color: white;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-features {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon i {
            font-size: 18px;
        }

        .feature-text {
            font-size: 14px;
            line-height: 1.5;
        }

        .feature-text strong {
            display: block;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .form-section {
            width: 520px;
            min-width: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 210, 255, 0.1);
            position: relative;
        }

        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--tech-accent), transparent);
            opacity: 0.5;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .form-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tech-accent);
            font-size: 18px;
            transition: color 0.2s ease;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            color: white;
            transition: all 0.2s ease;
            background: rgba(0, 210, 255, 0.05);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--tech-accent);
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15), 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: var(--tech-accent);
            opacity: 1;
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--tech-accent);
        }

        .form-check-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--tech-accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--tech-secondary);
        }

        .btn-login {
            width: 100%;
            padding: 16px 24px;
            background: transparent;
            color: var(--tech-accent);
            border: 2px solid var(--tech-accent);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: var(--tech-accent);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .btn-login:hover::before {
            width: 100%;
        }

        .btn-login:hover {
            color: var(--primary-dark);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            border-color: rgba(0, 210, 255, 0.3);
            color: rgba(0, 210, 255, 0.5);
        }

        .btn-login:disabled::before {
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 210, 255, 0.15);
        }

        .divider span {
            padding: 0 16px;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link a {
            color: var(--tech-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: var(--tech-secondary);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-danger {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--tech-accent);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .guest-link {
            text-align: center;
            margin-top: 16px;
        }

        .guest-link a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .guest-link a:hover {
            color: var(--tech-accent);
        }

        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }

            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 480px;
                margin: 0 auto;
                padding: 40px;
            }
        }

        @media (max-width: 480px) {
            .form-section {
                padding: 30px 24px;
            }

            .form-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="login-wrapper">
        <div class="brand-section">
            <div class="brand-bg-overlay"></div>
            <div class="brand-glow"></div>
            <div class="brand-grid-line line-1"></div>
            <div class="brand-grid-line line-2"></div>
            <div class="brand-grid-line line-3"></div>
            <div class="brand-grid-line line-4"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">数据要素资产化智能评估平台<br>让数据价值看得见、可量化、能变现</p>

                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-clipboard-data"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数据资产深度调研</strong>
                            6大维度全面采集企业信息，精准画像
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-cpu"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数维·智规融合评估</strong>
                            规则+知识+AI三位一体智能诊断
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-phone"></i>
                        </div>
                        <div class="feature-text">
                            <strong>双端一体化加持</strong>
                            Web+小程序双端联动，数据随时可查
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">账号登录</h2>
                <p class="form-desc">欢迎使用数维·数据资产管家平台</p>
            </div>

            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">登 录</button>
            </form>

            <div class="divider">
                <span>还没有账号？</span>
            </div>

            <div class="register-link">
                <a href="/register.html">立即注册</a>，开启数据资产化之旅
            </div>

            <div class="guest-link">
                <a href="/survey">暂不登录，直接体验</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="ui-particles-simple.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing particle background...');
            const particles = initParticleBackground('particles-canvas', {
                particleColor: '0, 210, 255',
                particleCount: 150,
                lineDistance: 250,
                particleRadius: 4,
                speed: 1.2,
                lineOpacity: 0.5,
                particleOpacity: 1,
                flowSpeed: 3
            });
            console.log('Particle background initialized:', particles);
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        function redirectByUserType(userType) {
            if (userType === 'admin') {
                window.location.href = '/admin-new';
            } else {
                window.location.href = '/home';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) return;

            fetch('/api/v1/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => {
                if (!response.ok) throw new Error('Auth check failed');
                return response.json();
            })
            .then(data => {
                if (data && data.data && data.data.user_type) {
                    redirectByUserType(data.data.user_type);
                }
            })
            .catch(() => {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('请填写用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.access_token);

                    const userType = result.user_type || 'client';
                    localStorage.setItem('userInfo', JSON.stringify({
                        username: result.username || username,
                        user_type: userType
                    }));

                    redirectByUserType(userType);
                } else {
                    showError(result.detail || '登录失败，请检查用户名和密码');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }
        });

        checkAuth();
    </script>
</body>
</html>
