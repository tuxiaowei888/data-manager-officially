<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 表单页UI测试V2</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #0a0e17;
            --bg-card: #0d1321;
            --accent-cyan: #00f5ff;
            --accent-blue: #0066ff;
            --accent-green: #00ff88;
            --accent-orange: #ff6b35;
            --text-primary: #e8f4f8;
            --text-secondary: #8892a0;
            --border-color: rgba(0, 245, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .glow-effect {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 { top: -100px; left: 50%; background: var(--accent-cyan); }
        .glow-2 { bottom: -100px; left: 50%; background: var(--accent-blue); }

        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* 导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.3);
        }

        .brand-icon i { font-size: 22px; color: var(--bg-dark); }

        .brand-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--bg-dark);
        }

        /* 页面标题 */
        .page-header {
            padding: 32px;
            background: rgba(13, 19, 33, 0.8);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 16px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i { color: var(--accent-cyan); }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            padding-left: 36px;
        }

        /* 步骤指示�?*/
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
            padding: 0 40px;
        }

        .step-indicator::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 60px;
            right: 60px;
            height: 2px;
            background: rgba(0, 245, 255, 0.15);
            z-index: 1;
        }

        .step-indicator .progress-line {
            position: absolute;
            top: 18px;
            left: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            z-index: 2;
            width: 33%;
        }

        .step {
            text-align: center;
            position: relative;
            z-index: 3;
            flex: 1;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(13, 19, 33, 0.8);
            border: 2px solid rgba(0, 245, 255, 0.3);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .step.active .step-circle {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
        }

        .step.completed .step-circle {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: var(--bg-dark);
        }

        .step-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .step.active .step-label { color: var(--accent-cyan); font-weight: 600; }
        .step.completed .step-label { color: var(--accent-green); }

        /* 进度�?*/
        .progress-section {
            margin-bottom: 32px;
            padding: 20px 24px;
            background: rgba(13, 19, 33, 0.6);
            border: 1px solid rgba(0, 245, 255, 0.1);
            border-radius: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .progress-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-value {
            font-family: "Roboto Mono", monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .progress-nodes {
            display: flex;
            gap: 6px;
        }

        .progress-node {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 245, 255, 0.1);
        }

        .progress-node.completed { background: var(--accent-green); }
        .progress-node.active { background: var(--accent-cyan); animation: pulse 1.5s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* 表单区块 */
        .form-section {
            padding: 32px;
            background: rgba(13, 19, 33, 0.8);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            padding-left: 14px;
            border-left: 3px solid var(--accent-cyan);
        }

        .section-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            padding-left: 17px;
        }

        /* 问题卡片 */
        .question-card {
            padding: 24px;
            background: rgba(0, 245, 255, 0.03);
            border: 1px solid rgba(0, 245, 255, 0.08);
            border-radius: 12px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            background: rgba(0, 245, 255, 0.06);
            border-color: rgba(0, 245, 255, 0.15);
        }

        .question-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .question-number {
            background: rgba(0, 245, 255, 0.15);
            color: var(--accent-cyan);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .required-mark { color: var(--accent-orange); margin-left: 4px; }

        /* 选项 */
        .option-list { display: flex; flex-direction: column; gap: 10px; }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0, 245, 255, 0.03);
            border: 1px solid rgba(0, 245, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-item:hover {
            background: rgba(0, 245, 255, 0.08);
            border-color: rgba(0, 245, 255, 0.2);
        }

        .option-item.selected {
            background: rgba(0, 245, 255, 0.1);
            border-color: rgba(0, 245, 255, 0.3);
        }

        .option-radio { accent-color: var(--accent-cyan); }

        .option-text { font-size: 14px; color: var(--text-primary); }

        /* 输入�?*/
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.15);
        }

        .input-field::placeholder { color: var(--text-secondary); }

        /* 其他输入 */
        .other-input {
            margin-top: 12px;
            padding: 14px;
            background: rgba(0, 245, 255, 0.03);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 8px 8px 0;
        }

        .other-label {
            font-size: 12px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: rgba(0, 245, 255, 0.1);
            border: 1px solid rgba(0, 245, 255, 0.2);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: rgba(0, 245, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            color: var(--bg-dark);
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .step-indicator { padding: 0 20px; }
            .step-indicator::before { left: 30px; right: 30px; }
            .step-indicator .progress-line { left: 30px; }
            .form-section { padding: 24px; }
            .page-header { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-effect glow-1"></div>
    <div class="glow-effect glow-2"></div>

    <div class="page-wrapper">
        <!-- 导航 -->
        <nav class="top-nav">
            <a href="/" class="nav-brand">
                <div class="brand-icon">
                    <i class="bi bi-database-fill"></i>
                </div>
                <span class="brand-text">数维数据管家</span>
            </a>
            <div class="nav-user">
                <span class="user-name">张三</span>
                <div class="user-avatar">Z</div>
            </div>
        </nav>

        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-clipboard-data"></i>
                数据资产化深度调�?            </h1>
            <p class="page-subtitle">完成调研问卷，帮助我们更好地了解您的数据资产现状</p>
        </div>

        <!-- 步骤指示�?-->
        <div class="step-indicator">
            <div class="progress-line"></div>
            <div class="step active">
                <div class="step-circle">1</div>
                <div class="step-label">基本信息</div>
            </div>
            <div class="step">
                <div class="step-circle">2</div>
                <div class="step-label">数据资产</div>
            </div>
            <div class="step">
                <div class="step-circle">3</div>
                <div class="step-label">合规评估</div>
            </div>
        </div>

        <!-- 进度�?-->
        <div class="progress-section">
            <div class="progress-header">
                <span class="progress-label">当前进度</span>
                <span class="progress-value">33%</span>
            </div>
            <div class="progress-nodes">
                <div class="progress-node completed"></div>
                <div class="progress-node completed"></div>
                <div class="progress-node active"></div>
                <div class="progress-node"></div>
                <div class="progress-node"></div>
                <div class="progress-node"></div>
            </div>
        </div>

        <!-- 表单 -->
        <div class="form-section">
            <h2 class="section-title">基本信息</h2>
            <p class="section-desc">请填写您的基本信息和公司概况</p>

            <!-- 问题1 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">1</span>
                    <span>贵公司所属行业类型？<span class="required-mark">*</span></span>
                </label>
                <div class="option-list">
                    <label class="option-item selected">
                        <input type="radio" class="option-radio" name="q1" checked>
                        <span class="option-text">科技/互联�?/span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">金融/银行</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">制造业</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q1">
                        <span class="option-text">零售/电商</span>
                    </label>
                </div>
            </div>

            <!-- 问题2 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">2</span>
                    <span>贵公司员工数量？<span class="required-mark">*</span></span>
                </label>
                <div class="option-list">
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">50人以�?/span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">50-200�?/span>
                    </label>
                    <label class="option-item selected">
                        <input type="radio" class="option-radio" name="q2" checked>
                        <span class="option-text">200-500�?/span>
                    </label>
                    <label class="option-item">
                        <input type="radio" class="option-radio" name="q2">
                        <span class="option-text">500人以�?/span>
                    </label>
                </div>
            </div>

            <!-- 问题3 -->
            <div class="question-card">
                <label class="question-label">
                    <span class="question-number">3</span>
                    <span>贵公司数据团队规模？<span class="required-mark">*</span></span>
                </label>
                <input type="text" class="input-field" placeholder="请输入数据团队人数，如：10�? value="8�?>
                <div class="other-input">
                    <div class="other-label">
                        <i class="bi bi-info-circle"></i>
                        说明：数据团队包括数据分析师、数据工程师、BI工程师等
                    </div>
                </div>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
                上一�?            </button>
            <button class="btn btn-primary">
                下一�?                <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>
</body>
</html>
