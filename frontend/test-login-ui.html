<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面 UI 测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .brand-section {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.7) 0%, rgba(15, 23, 42, 0.6) 50%, rgba(20, 30, 60, 0.5) 100%);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            border-right: 1px solid rgba(0, 210, 255, 0.2);
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 210, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(78, 205, 196, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 150, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .brand-glow {
            position: absolute;
            top: -30%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(78, 205, 196, 0.15) 40%, transparent 70%);
            animation: brandGlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 500px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3) 0%, rgba(78, 205, 196, 0.2) 100%);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.3), inset 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .brand-logo i {
            font-size: 44px;
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d2ff, #4ecdc4, #00d2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 3s linear infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .brand-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-features {
            text-align: left;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 28px 32px;
            backdrop-filter: blur(10px);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(78, 205, 196, 0.2));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon i {
            font-size: 20px;
            color: #00d2ff;
        }

        .feature-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
        }

        .feature-text strong {
            display: block;
            font-size: 15px;
            margin-bottom: 3px;
            color: #fff;
        }

        .form-section {
            width: 480px;
            min-width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 60px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 210, 255, 0.1);
            position: relative;
        }

        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d2ff, #4ecdc4, transparent);
            opacity: 0.6;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .form-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d2ff;
            font-size: 18px;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: all 0.2s ease;
            background-color: rgba(10, 15, 30, 0.8) !important;
            background-image: none !important;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d2ff;
            background-color: rgba(10, 15, 30, 0.95) !important;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2), 0 0 25px rgba(0, 210, 255, 0.25);
        }

        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px rgba(10, 15, 30, 0.95) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: #00d2ff;
            opacity: 1;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4) !important;
        }

        .btn-login {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #00d2ff 0%, #4ecdc4 100%);
            color: #0a0f1e;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 210, 255, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }
            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 480px;
                margin: 0 auto;
                padding: 40px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>

    <div class="login-wrapper">
        <div class="brand-section">
            <div class="brand-glow"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">数据要素资产化智能评估平台<br>让数据价值看得见、可量化、能变现</p>

                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-clipboard-data"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数据资产深度调研</strong>
                            6大维度全面采集企业信息，精准画像
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-cpu"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数维·智规融合评估</strong>
                            规则+知识+AI三位一体智能诊断
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-phone"></i>
                        </div>
                        <div class="feature-text">
                            <strong>双端一体化加持</strong>
                            Web+小程序双端联动，数据随时可查
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">账号登录</h2>
                <p class="form-desc">欢迎使用数维·数据资产管家平台</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                        <i class="bi bi-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">登 录</button>
            </form>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let connections = [];

        const config = {
            particleCount: 100,
            particleRadius: 3,
            lineDistance: 180,
            particleColor: '0, 210, 255',
            lineColor: '0, 210, 255',
            bgColor: '#0a0f1e',
            particleSpeed: 0.8,
            glowIntensity: 15
        };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * config.particleSpeed;
                this.vy = (Math.random() - 0.5) * config.particleSpeed;
                this.radius = Math.random() * config.particleRadius + 1;
                this.color = config.particleColor;
                this.glow = Math.random() * config.glowIntensity + 5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, 0.8)`;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = `rgba(${this.color}, 0.6)`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.lineDistance) {
                        const opacity = (1 - distance / config.lineDistance) * 0.4;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(${config.lineColor}, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = `rgba(${config.lineColor}, 0.3)`;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function drawGrid() {
            const gridSize = 60;
            const time = Date.now() * 0.001;

            ctx.strokeStyle = 'rgba(0, 210, 255, 0.03)';
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const scanLineY = (time * 30) % height;
            ctx.strokeStyle = `rgba(0, 210, 255, ${0.1 + 0.05 * Math.sin(time * 2)})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, scanLineY);
            ctx.lineTo(width, scanLineY);
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, width, height);

            drawGrid();
            drawConnections();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        window.addEventListener('resize', () => {
            resize();
        });

        init();
    </script>
</body>
</html>
