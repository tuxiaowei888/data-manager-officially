<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 登录页UI测试V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #0a0e17;
            --bg-card: #0d1321;
            --accent-cyan: #00f5ff;
            --accent-blue: #0066ff;
            --accent-purple: #7b2cff;
            --accent-green: #00ff88;
            --text-primary: #e8f4f8;
            --text-secondary: #8892a0;
            --border-color: rgba(0, 245, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 网格背景 */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        /* 渐变光效 */
        .glow-effect {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
        }

        .glow-1 {
            top: -200px;
            right: -100px;
            background: var(--accent-cyan);
        }

        .glow-2 {
            bottom: -200px;
            left: -100px;
            background: var(--accent-blue);
        }

        /* 登录容器 */
        .login-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
        }

        /* 左侧品牌区 */
        .brand-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
        }

        .brand-content {
            max-width: 480px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
            position: relative;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .logo-icon i {
            font-size: 32px;
            color: var(--bg-dark);
        }

        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .logo-text p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .brand-slogan {
            margin-bottom: 50px;
        }

        .brand-slogan h2 {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .brand-slogan h2 span {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-slogan p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .data-stats {
            display: flex;
            gap: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: "Roboto Mono", monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 右侧登录区 */
        .login-panel {
            width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 48px;
            background: rgba(13, 19, 33, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 
                0 0 40px rgba(0, 245, 255, 0.1),
                inset 0 0 60px rgba(0, 245, 255, 0.02);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 输入框 */
        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            font-size: 18px;
            opacity: 0.7;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
            background: rgba(0, 245, 255, 0.08);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* 选项 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-cyan);
        }

        .remember-me span {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 14px;
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        /* 按钮 */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
            border: none;
            border-radius: 10px;
            color: var(--bg-dark);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .register-link a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        /* 底部装饰 */
        .bottom-decoration {
            position: absolute;
            bottom: 40px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .decoration-text {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .decoration-links {
            display: flex;
            gap: 20px;
        }

        .decoration-links a {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .decoration-links a:hover {
            opacity: 1;
            color: var(--accent-cyan);
        }

        @media (max-width: 1024px) {
            .brand-panel {
                display: none;
            }
            .login-panel {
                width: 100%;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-effect glow-1"></div>
    <div class="glow-effect glow-2"></div>

    <div class="login-container">
        <div class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="bi bi-database-fill"></i>
                    </div>
                    <div class="logo-text">
                        <h1>数维数据管家</h1>
                        <p>企业数据资产化智能管理平台</p>
                    </div>
                </div>

                <div class="brand-slogan">
                    <h2>让数据资产<br><span>创造商业价值</span></h2>
                    <p>通过深度调研与智能分析，帮助企业实现数据资产标准化、合规化管理，提升数据治理能力与商业洞察力。</p>
                </div>

                <div class="data-stats">
                    <div class="stat-item">
                        <div class="stat-value">10K+</div>
                        <div class="stat-label">数据资产</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">500+</div>
                        <div class="stat-label">企业用户</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">99.9%</div>
                        <div class="stat-label">服务可用性</div>
                    </div>
                </div>
            </div>

            <div class="bottom-decoration">
                <span class="decoration-text">© 2024 数维数据管家 v2.0</span>
                <div class="decoration-links">
                    <a href="#">关于我们</a>
                    <a href="#">服务条款</a>
                    <a href="#">隐私政策</a>
                </div>
            </div>
        </div>

        <div class="login-panel">
            <div class="login-card">
                <div class="login-header">
                    <h3>欢迎回来</h3>
                    <p>请登录您的账号继续</p>
                </div>

                <form>
                    <div class="input-group">
                        <label class="input-label">用户名 / 手机号</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" class="input-field" placeholder="请输入用户名或手机号">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">密码</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="input-field" placeholder="请输入密码">
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-link">忘记密码？</a>
                    </div>

                    <button type="button" class="btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        登 录
                    </button>

                    <div class="register-link">
                        还没有账号？<a href="/register">立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
