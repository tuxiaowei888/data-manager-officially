<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面 UI 测试 - 灰色版</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .test-btn {
            width: 300px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #4a4a4a 0%, #6a6a6a 50%, #8a8a8a 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .test-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #5a5a5a 0%, #7a7a7a 50%, #9a9a9a 100%);
        }

        .test-btn::before {
            content: '';
            display: block;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div>
        <h1 style="color: white; text-align: center;">灰色按钮测试</h1>
        <button class="test-btn">登 录</button>
    </div>
</body>
</html>
