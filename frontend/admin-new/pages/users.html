<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 数维数据管家</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/admin-new/css/common.css" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <canvas id="sidebar-particles"></canvas>
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                    <span>数维·数据管家</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">主要功能</div>
                <a href="/admin-new/index.html" class="nav-item">
                    <i class="bi bi-speedometer2"></i>
                    <span>仪表盘</span>
                </a>
                <a href="/admin-new/pages/customers.html" class="nav-item">
                    <i class="bi bi-people"></i>
                    <span>客户管理</span>
                </a>
                <a href="/admin-new/pages/reports.html" class="nav-item">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>报告管理</span>
                </a>
                <a href="/admin-new/pages/rules.html" class="nav-item">
                    <i class="bi bi-list-check"></i>
                    <span>规则库管理</span>
                </a>
                <a href="/admin-new/pages/ai-config.html" class="nav-item">
                    <i class="bi bi-robot"></i>
                    <span>AI配置</span>
                </a>
                <a href="/admin-new/pages/knowledge.html" class="nav-item">
                    <i class="bi bi-book"></i>
                    <span>知识库管理</span>
                </a>
                <div class="nav-section-title">系统管理</div>
                <a href="/admin-new/pages/users.html" class="nav-item active">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin-new/pages/vip-config.html" class="nav-item">
                    <i class="bi bi-gem"></i>
                    <span>VIP配置</span>
                </a>
                <a href="/admin-new/pages/history.html" class="nav-item">
                    <i class="bi bi-clock-history"></i>
                    <span>评估历史</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <canvas id="topbar-particles"></canvas>
                <div class="topbar-left">
                    <h1 class="topbar-title"><i class="bi bi-people"></i> 用户管理</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <span class="user-name" id="userName">管理员</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="bi bi-box-arrow-left"></i>
                        退出
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div class="search-bar">
                    <div class="search-input">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="搜索用户名、邮箱、手机号...">
                    </div>
                    <div class="filter-group">
                        <select class="filter-select" id="filterType">
                            <option value="">全部类型</option>
                            <option value="admin">管理员</option>
                            <option value="user">普通用户</option>
                        </select>
                        <select class="filter-select" id="filterStatus">
                            <option value="">全部状态</option>
                            <option value="active">启用</option>
                            <option value="inactive">禁用</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadUsers()">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                        <button class="btn btn-success" onclick="openAddUserModal()">
                            <i class="bi bi-plus-lg"></i> 添加用户
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">用户列表</span>
                        <span id="userCount">共 0 条</span>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>邮箱</th>
                                        <th>手机号</th>
                                        <th>用户类型</th>
                                        <th>VIP状态</th>
                                        <th>状态</th>
                                        <th>注册时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="userTableBody">
                                    <tr>
                                        <td colspan="9" style="text-align: center; padding: 40px;">
                                            <div class="loading-spinner"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="userModalTitle">添加用户</h3>
                <button class="modal-close" onclick="closeUserModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱 <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="phone">
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label" id="passwordLabel">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <div class="form-group">
                        <label class="form-label">用户类型</label>
                        <select class="form-control" id="userType">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">VIP状态</label>
                        <select class="form-control" id="isVip">
                            <option value="0">普通用户</option>
                            <option value="1">VIP用户</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeUserModal()">取消</button>
                <button class="btn btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">用户详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body" id="detailContent">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="/admin-new/js/common.js"></script>
    <script>
        // 侧边栏粒子动画
        (function initSidebarParticles() {
            const canvas = document.getElementById('sidebar-particles');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const config = { particleCount: 50, particleRadius: 2, lineDistance: 80, particleColor: '0, 210, 255' };
            class Particle {
                constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.6; this.vy = (Math.random() - 0.5) * 0.6; this.radius = Math.random() * 2 + 1; this.glow = Math.random() * 8 + 5; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${config.particleColor}, 0.6)`; ctx.shadowBlur = this.glow; ctx.shadowColor = `rgba(${config.particleColor}, 0.5)`; ctx.fill(); ctx.shadowBlur = 0; }
            }
            function resize() { width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; }
            function drawConnections() {
                for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy); if (distance < config.lineDistance) { const opacity = (1 - distance / config.lineDistance) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(${config.particleColor}, ${opacity})`; ctx.lineWidth = 0.8; ctx.stroke(); } } }
            }
            function animate() { ctx.clearRect(0, 0, width, height); drawConnections(); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
            function init() { resize(); particles = []; for (let i = 0; i < config.particleCount; i++) particles.push(new Particle()); animate(); }
            window.addEventListener('resize', resize); init();
        })();

        // 顶部栏粒子动画
        (function initTopbarParticles() {
            const canvas = document.getElementById('topbar-particles');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const config = { particleCount: 60, particleRadius: 2, lineDistance: 100, particleColor: '0, 210, 255' };
            class Particle {
                constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 2 + 1; this.glow = Math.random() * 8 + 5; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${config.particleColor}, 0.6)`; ctx.shadowBlur = this.glow; ctx.shadowColor = `rgba(${config.particleColor}, 0.5)`; ctx.fill(); ctx.shadowBlur = 0; }
            }
            function resize() { width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; }
            function drawConnections() { for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy); if (distance < config.lineDistance) { const opacity = (1 - distance / config.lineDistance) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(${config.particleColor}, ${opacity})`; ctx.lineWidth = 0.8; ctx.stroke(); } } } }
            function animate() { ctx.clearRect(0, 0, width, height); drawConnections(); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
            function init() { resize(); particles = []; for (let i = 0; i < config.particleCount; i++) particles.push(new Particle()); animate(); }
            window.addEventListener('resize', resize); init();
        })();

        let allUsers = [];
        let filteredUsers = [];
        let pagination = null;
        let isEdit = false;

        document.addEventListener('DOMContentLoaded', async function() {
            const user = checkAuth();
            if (!user) return;

            document.getElementById('userName').textContent = user.username || '管理员';
            document.getElementById('userAvatar').textContent = (user.username || 'A').charAt(0).toUpperCase();

            pagination = new Pagination({
                pageSize: 10,
                onPageChange: renderUserTable
            });
            paginationObj = pagination;

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loadUsers();
            });

            await loadUsers();
        });

        async function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            showLoading(tbody);

            try {
                const response = await apiGet('/users');
                allUsers = (response.data && Array.isArray(response.data)) ? response.data : [];
                if (!response.data || !Array.isArray(response.data)) {
                    console.warn('用户数据格式异常:', response);
                }
                filterUsers();
            } catch (error) {
                console.error('加载用户失败:', error);
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">加载失败: ${error.message}</td></tr>`;
            }
        }

        function filterUsers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const userType = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;

            filteredUsers = allUsers.filter(u => {
                if (keyword) {
                    const matchUsername = (u.username || '').toLowerCase().includes(keyword);
                    const matchEmail = (u.email || '').toLowerCase().includes(keyword);
                    const matchPhone = (u.phone || '').toLowerCase().includes(keyword);
                    if (!matchUsername && !matchEmail && !matchPhone) return false;
                }
                if (userType && u.user_type !== userType && u.type !== userType) return false;
                if (status === 'active' && !u.is_active) return false;
                if (status === 'inactive' && u.is_active) return false;
                return true;
            });

            document.getElementById('userCount').textContent = `共 ${filteredUsers.length} 条`;
            pagination.setTotal(filteredUsers.length);
            pagination.render('pagination');
            renderUserTable(1);
        }

        function renderUserTable(page) {
            const tbody = document.getElementById('userTableBody');
            const start = (page - 1) * pagination.pageSize;
            const end = start + pagination.pageSize;
            const pageUsers = filteredUsers.slice(start, end);

            if (pageUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted" style="padding: 40px;">暂无用户数据</td></tr>`;
                return;
            }

            tbody.innerHTML = pageUsers.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td><strong>${u.username || '-'}</strong></td>
                    <td>${u.email || '-'}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${getUserTypeBadge(u.user_type || u.type)}</td>
                    <td>${u.is_vip ? '<span class="badge badge-warning">VIP</span>' : '<span class="badge badge-secondary">普通</span>'}</td>
                    <td>
                        <span class="status-badge ${u.is_active !== false ? 'active' : 'inactive'}">
                            ${u.is_active !== false ? '启用' : '禁用'}
                        </span>
                    </td>
                    <td>${formatDate(u.created_at || u.register_time)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-secondary" onclick="viewUserDetail(${u.id})" title="查看详情">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-primary" onclick="editUser(${u.id})" title="编辑">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm ${u.is_active ? 'btn-warning' : 'btn-success'}" onclick="toggleUserStatus(${u.id}, ${!u.is_active})" title="${u.is_active ? '禁用' : '启用'}">
                                <i class="bi ${u.is_active ? 'bi-pause' : 'bi-play'}"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})" title="删除">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openAddUserModal() {
            isEdit = false;
            document.getElementById('userModalTitle').textContent = '添加用户';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('passwordLabel').innerHTML = '密码 <span class="text-danger">*</span>';
            document.getElementById('password').required = true;
            document.getElementById('userModal').classList.add('active');
        }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            isEdit = true;
            document.getElementById('userModalTitle').textContent = '编辑用户';
            document.getElementById('userId').value = user.id;
            document.getElementById('username').value = user.username || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('userType').value = user.user_type || user.type || 'user';
            document.getElementById('isVip').value = user.is_vip ? '1' : '0';
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('passwordLabel').innerHTML = '密码 <span class="text-muted">(不修改请留空)</span>';
            document.getElementById('password').required = false;
            document.getElementById('userModal').classList.add('active');
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        async function saveUser() {
            const id = document.getElementById('userId').value;
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const userType = document.getElementById('userType').value;
            const isVip = document.getElementById('isVip').value === '1';
            const password = document.getElementById('password').value;

            if (!username || !email) {
                showMessage('用户名和邮箱不能为空', 'error');
                return;
            }

            if (!isEdit && !password) {
                showMessage('密码不能为空', 'error');
                return;
            }

            const data = { username, email, phone, user_type: userType, is_vip: isVip };
            if (password) data.password = password;

            try {
                if (isEdit) {
                    await apiPut(`/users/${id}`, data);
                    showMessage('用户更新成功', 'success');
                } else {
                    await apiPost('/users', data);
                    showMessage('用户创建成功', 'success');
                }
                closeUserModal();
                await loadUsers();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function toggleUserStatus(id, newStatus) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            const action = newStatus ? '启用' : '禁用';
            if (!confirm(`确定要${action}该用户吗？`)) return;

            try {
                await apiPut(`/users/${id}`, { is_active: newStatus });
                showMessage(`用户${action}成功`, 'success');
                await loadUsers();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('确定要删除该用户吗？此操作不可恢复！')) return;

            try {
                await apiDelete(`/users/${id}`);
                showMessage('用户删除成功', 'success');
                await loadUsers();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function viewUserDetail(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            document.getElementById('detailModal').classList.add('active');
            const content = document.getElementById('detailContent');

            content.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">用户ID</label>
                        <div class="form-control" style="background: var(--bg-primary);">${user.id}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <div class="form-control" style="background: var(--bg-primary);">${user.username || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <div class="form-control" style="background: var(--bg-primary);">${user.email || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <div class="form-control" style="background: var(--bg-primary);">${user.phone || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">用户类型</label>
                        <div class="form-control" style="background: var(--bg-primary);">${getUserTypeBadge(user.user_type || user.type)}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">VIP状态</label>
                        <div class="form-control" style="background: var(--bg-primary);">${user.is_vip ? '<span class="badge badge-warning">VIP</span>' : '<span class="badge badge-secondary">普通</span>'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <div class="form-control" style="background: var(--bg-primary);">
                            <span class="status-badge ${user.is_active !== false ? 'active' : 'inactive'}">
                                ${user.is_active !== false ? '启用' : '禁用'}
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">注册时间</label>
                        <div class="form-control" style="background: var(--bg-primary);">${formatDate(user.created_at || user.register_time)}</div>
                    </div>
                </div>
            `;
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeUserModal();
        });

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });
    </script>
</body>
</html>
