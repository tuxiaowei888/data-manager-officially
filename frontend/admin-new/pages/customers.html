<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 数维数据管家</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/admin-new/css/common.css" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <canvas id="sidebar-particles"></canvas>
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                    <span>数维·数据管家</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">主要功能</div>
                <a href="/admin-new/index.html" class="nav-item">
                    <i class="bi bi-speedometer2"></i>
                    <span>仪表盘</span>
                </a>
                <a href="/admin-new/pages/customers.html" class="nav-item active">
                    <i class="bi bi-people"></i>
                    <span>客户管理</span>
                </a>
                <a href="/admin-new/pages/reports.html" class="nav-item">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>报告管理</span>
                </a>
                <a href="/admin-new/pages/rules.html" class="nav-item">
                    <i class="bi bi-list-check"></i>
                    <span>规则库管理</span>
                </a>
                <a href="/admin-new/pages/ai-config.html" class="nav-item">
                    <i class="bi bi-robot"></i>
                    <span>AI配置</span>
                </a>
                <a href="/admin-new/pages/knowledge.html" class="nav-item">
                    <i class="bi bi-book"></i>
                    <span>知识库管理</span>
                </a>
                <div class="nav-section-title">系统管理</div>
                <a href="/admin-new/pages/users.html" class="nav-item">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin-new/pages/vip-config.html" class="nav-item">
                    <i class="bi bi-gem"></i>
                    <span>VIP配置</span>
                </a>
                <a href="/admin-new/pages/history.html" class="nav-item">
                    <i class="bi bi-clock-history"></i>
                    <span>评估历史</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="topbar">
                <canvas id="topbar-particles"></canvas>
                <div class="topbar-left">
                    <h1 class="topbar-title"><i class="bi bi-people"></i> 客户管理</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <span class="user-name" id="userName">管理员</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="bi bi-box-arrow-left"></i>
                        退出
                    </button>
                </div>
            </header>

            <div class="page-content">
                <!-- 搜索和筛选 -->
                <div class="search-bar">
                    <div class="search-input">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="搜索客户名称、联系人...">
                    </div>
                    <div class="filter-group">
                        <select class="filter-select" id="filterRisk">
                            <option value="">全部风险</option>
                            <option value="P0">P0 高风险</option>
                            <option value="P1">P1 中风险</option>
                            <option value="P2">P2 低风险</option>
                        </select>
                        <select class="filter-select" id="filterVip">
                            <option value="">全部客户</option>
                            <option value="1">VIP客户</option>
                            <option value="0">普通客户</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadCustomers()">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                    </div>
                </div>

                <!-- 客户列表 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">客户列表</span>
                        <span id="customerCount">共 0 条</span>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>客户名称</th>
                                        <th>联系人</th>
                                        <th>联系方式</th>
                                        <th>最新评分</th>
                                        <th>平均评分</th>
                                        <th>风险等级</th>
                                        <th>评估次数</th>
                                        <th>VIP状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="customerTableBody">
                                    <tr>
                                        <td colspan="10" style="text-align: center; padding: 40px;">
                                            <div class="loading-spinner"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 客户详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width: 900px;">
            <div class="modal-header">
                <h3 class="modal-title">客户详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body" id="detailContent">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="/admin-new/js/common.js"></script>
    <script>
        // 侧边栏粒子动画
        (function initSidebarParticles() {
            const canvas = document.getElementById('sidebar-particles');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const config = { particleCount: 50, particleRadius: 2, lineDistance: 80, particleColor: '0, 210, 255' };
            class Particle {
                constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.6; this.vy = (Math.random() - 0.5) * 0.6; this.radius = Math.random() * 2 + 1; this.glow = Math.random() * 8 + 5; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${config.particleColor}, 0.6)`; ctx.shadowBlur = this.glow; ctx.shadowColor = `rgba(${config.particleColor}, 0.5)`; ctx.fill(); ctx.shadowBlur = 0; }
            }
            function resize() { width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; }
            function drawConnections() {
                for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy); if (distance < config.lineDistance) { const opacity = (1 - distance / config.lineDistance) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(${config.particleColor}, ${opacity})`; ctx.lineWidth = 0.8; ctx.stroke(); } } }
            }
            function animate() { ctx.clearRect(0, 0, width, height); drawConnections(); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
            function init() { resize(); particles = []; for (let i = 0; i < config.particleCount; i++) particles.push(new Particle()); animate(); }
            window.addEventListener('resize', resize); init();
        })();

        // 顶部栏粒子动画
        (function initTopbarParticles() {
            const canvas = document.getElementById('topbar-particles');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const config = { particleCount: 60, particleRadius: 2, lineDistance: 100, particleColor: '0, 210, 255' };
            class Particle {
                constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 2 + 1; this.glow = Math.random() * 8 + 5; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${config.particleColor}, 0.6)`; ctx.shadowBlur = this.glow; ctx.shadowColor = `rgba(${config.particleColor}, 0.5)`; ctx.fill(); ctx.shadowBlur = 0; }
            }
            function resize() { width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; }
            function drawConnections() { for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy); if (distance < config.lineDistance) { const opacity = (1 - distance / config.lineDistance) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(${config.particleColor}, ${opacity})`; ctx.lineWidth = 0.8; ctx.stroke(); } } } }
            function animate() { ctx.clearRect(0, 0, width, height); drawConnections(); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
            function init() { resize(); particles = []; for (let i = 0; i < config.particleCount; i++) particles.push(new Particle()); animate(); }
            window.addEventListener('resize', resize); init();
        })();

        let allCustomers = [];
        let filteredCustomers = [];
        let currentCustomer = null;
        let pagination = null;

        document.addEventListener('DOMContentLoaded', async function() {
            const user = checkAuth();
            if (!user) return;

            document.getElementById('userName').textContent = user.username || '管理员';
            document.getElementById('userAvatar').textContent = (user.username || 'A').charAt(0).toUpperCase();

            // 初始化分页
            pagination = new Pagination({
                pageSize: 10,
                onPageChange: renderCustomerTable
            });
            paginationObj = pagination;

            // 绑定搜索事件
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loadCustomers();
            });

            // 加载客户数据
            await loadCustomers();
        });

        async function loadCustomers() {
            const tbody = document.getElementById('customerTableBody');
            showLoading(tbody);

            try {
                const response = await apiGet('/customers');
                allCustomers = Array.isArray(response) ? response : (response.data || []);
                allCustomers = allCustomers.map(c => ({
                    id: c.id,
                    company_name: c.username || '-',
                    name: c.username || '-',
                    contact_name: '-',
                    contact_phone: c.phone || '-',
                    phone: c.phone || '-',
                    latest_score: c.latest_score || '-',
                    avg_score: c.avg_score || '-',
                    latest_risk_level: c.latest_risk_level || '-',
                    risk_level: c.latest_risk_level || '-',
                    evaluation_count: c.total_evaluations || 0,
                    is_vip: c.is_vip || false
                }));
                filterCustomers();
            } catch (error) {
                console.error('加载客户失败:', error);
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-danger">加载失败: ${error.message}</td></tr>`;
            }
        }

        function filterCustomers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const riskLevel = document.getElementById('filterRisk').value;
            const isVip = document.getElementById('filterVip').value;

            filteredCustomers = allCustomers.filter(c => {
                // 关键词筛选
                if (keyword) {
                    const matchName = (c.company_name || c.name || '').toLowerCase().includes(keyword);
                    const matchContact = (c.contact_name || '').toLowerCase().includes(keyword);
                    if (!matchName && !matchContact) return false;
                }

                // 风险等级筛选
                if (riskLevel && c.latest_risk_level !== riskLevel && c.risk_level !== riskLevel) {
                    return false;
                }

                // VIP筛选
                if (isVip !== '' && c.is_vip !== (isVip === '1')) {
                    return false;
                }

                return true;
            });

            document.getElementById('customerCount').textContent = `共 ${filteredCustomers.length} 条`;

            pagination.setTotal(filteredCustomers.length);
            pagination.render('pagination');
            renderCustomerTable(1);
        }

        function renderCustomerTable(page) {
            const tbody = document.getElementById('customerTableBody');
            const start = (page - 1) * pagination.pageSize;
            const end = start + pagination.pageSize;
            const pageCustomers = filteredCustomers.slice(start, end);

            if (pageCustomers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted" style="padding: 40px;">暂无客户数据</td></tr>`;
                return;
            }

            tbody.innerHTML = pageCustomers.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.company_name || c.name || '-'}</td>
                    <td>${c.contact_name || '-'}</td>
                    <td>${c.contact_phone || c.phone || '-'}</td>
                    <td><strong>${c.latest_score || '-'}</strong></td>
                    <td>${typeof c.avg_score === 'number' ? c.avg_score.toFixed(1) : (c.avg_score || '-')}</td>
                    <td>${getRiskBadge(c.latest_risk_level || c.risk_level)}</td>
                    <td>${c.evaluation_count || 0} 次</td>
                    <td>${c.is_vip ? '<span class="badge badge-warning">VIP</span>' : '<span class="badge badge-secondary">普通</span>'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-secondary" onclick="viewCustomerDetail(${c.id})" title="查看详情">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function viewCustomerDetail(id) {
            currentCustomer = allCustomers.find(c => c.id === id);
            if (!currentCustomer) return;

            const modal = document.getElementById('detailModal');
            const modalContent = modal.querySelector('.modal');

            modal.style.cssText = 'display: flex !important; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99999; align-items: center; justify-content: center;';
            modalContent.style.cssText = 'display: block !important; background: white; border-radius: 12px; padding: 20px; width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; z-index: 100000; position: relative; margin: auto;';
            modalContent.onclick = function(e) { e.stopPropagation(); };
            modal.onclick = function(e) { if (e.target === modal) closeDetailModal(); };

            const content = document.getElementById('detailContent');

            content.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">客户名称</label>
                        <div class="form-control" style="background: var(--bg-primary);">${currentCustomer.company_name || currentCustomer.name || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系人</label>
                        <div class="form-control" style="background: var(--bg-primary);">${currentCustomer.contact_name || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系电话</label>
                        <div class="form-control" style="background: var(--bg-primary);">${currentCustomer.contact_phone || currentCustomer.phone || '-'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">VIP状态</label>
                        <div class="form-control" style="background: var(--bg-primary);">${currentCustomer.is_vip ? '<span class="badge badge-warning">VIP</span>' : '<span class="badge badge-secondary">普通</span>'}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">最新评分</label>
                        <div class="form-control" style="background: var(--bg-primary);"><strong>${currentCustomer.latest_score || '-'}</strong></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">平均评分</label>
                        <div class="form-control" style="background: var(--bg-primary);">${typeof currentCustomer.avg_score === 'number' ? currentCustomer.avg_score.toFixed(1) : (currentCustomer.avg_score || '-')}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">风险等级</label>
                        <div class="form-control" style="background: var(--bg-primary);">${getRiskBadge(currentCustomer.latest_risk_level || currentCustomer.risk_level)}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">评估次数</label>
                        <div class="form-control" style="background: var(--bg-primary);">${currentCustomer.evaluation_count || 0} 次</div>
                    </div>
                </div>
            `;
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const modalContent = modal.querySelector('.modal');
            modal.style.cssText = 'display: none !important;';
            modalContent.style.cssText = '';
        }

    </script>
</body>
</html>
