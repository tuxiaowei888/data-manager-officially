<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 管理后台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/admin-new/css/common.css" rel="stylesheet">
    <style>
        .welcome-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        .welcome-section h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .welcome-section p {
            opacity: 0.9;
            font-size: 14px;
        }
        .welcome-decoration {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
        }
        .welcome-decoration .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            position: absolute;
        }
        .welcome-decoration .c1 { top: -40px; right: 0; }
        .welcome-decoration .c2 { top: 0; right: 60px; width: 60px; height: 60px; }
        .welcome-decoration .c3 { top: 40px; right: 30px; width: 40px; height: 40px; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .chart-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .chart-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
        }
        .chart-container {
            position: relative;
            height: 280px;
        }
        .chart-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="bi bi-database-gear"></i>
                    <span>数维数据管家</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">主要功能</div>
                <a href="index.html" class="nav-item active" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>仪表盘</span>
                </a>
                <a href="/admin-new/pages/customers.html" class="nav-item" data-page="customers">
                    <i class="bi bi-people"></i>
                    <span>客户管理</span>
                </a>
                <a href="/admin-new/pages/reports.html" class="nav-item" data-page="reports">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>报告管理</span>
                </a>
                <a href="/admin-new/pages/rules.html" class="nav-item" data-page="rules">
                    <i class="bi bi-list-check"></i>
                    <span>规则库管理</span>
                </a>
                <a href="/admin-new/pages/ai-config.html" class="nav-item" data-page="ai">
                    <i class="bi bi-robot"></i>
                    <span>AI配置</span>
                </a>
                <a href="/admin-new/pages/knowledge.html" class="nav-item" data-page="knowledge">
                    <i class="bi bi-book"></i>
                    <span>知识库管理</span>
                </a>
                <div class="nav-section-title">系统管理</div>
                <a href="/admin-new/pages/users.html" class="nav-item" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin-new/pages/vip-config.html" class="nav-item" data-page="vip">
                    <i class="bi bi-gem"></i>
                    <span>VIP配置</span>
                </a>
                <a href="/admin-new/pages/history.html" class="nav-item" data-page="history">
                    <i class="bi bi-clock-history"></i>
                    <span>评估历史</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="topbar-title"><i class="bi bi-speedometer2"></i> 仪表盘</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <span class="user-name" id="userName">管理员</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="bi bi-box-arrow-left"></i>
                        退出
                    </button>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                <!-- 欢迎区域 -->
                <div class="welcome-section">
                    <h1>欢迎回来，<span id="welcomeName">管理员</span></h1>
                    <p>今天是 <span id="todayDate"></span>，以下是系统概览</p>
                    <div class="welcome-decoration">
                        <div class="circle c1"></div>
                        <div class="circle c2"></div>
                        <div class="circle c3"></div>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalCustomers">0</h3>
                            <p>客户总数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="bi bi-file-earmark-text"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalReports">0</h3>
                            <p>评估报告</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">
                            <i class="bi bi-list-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalRules">0</h3>
                            <p>评估规则</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="bi bi-person-badge"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalUsers">0</h3>
                            <p>注册用户</p>
                        </div>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>客户评分分布</h3>
                        <div class="chart-container"><canvas id="scoreChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <h3>风险等级分布</h3>
                        <div class="chart-container"><canvas id="riskChart"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="/admin-new/js/common.js"></script>
    <script>
        // 全局图表对象
        let scoreChart = null;
        let riskChart = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查登录
            const user = checkAuth();
            if (!user) return;

            // 显示用户信息
            document.getElementById('welcomeName').textContent = user.username || '管理员';
            document.getElementById('userName').textContent = user.username || '管理员';
            document.getElementById('userAvatar').textContent = (user.username || 'A').charAt(0).toUpperCase();

            // 显示日期
            const today = new Date();
            document.getElementById('todayDate').textContent = today.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });

            // 加载数据
            await loadDashboardData();
        });

        // 加载仪表盘数据
        async function loadDashboardData() {
            try {
                // 并行加载所有数据
                const [customersRes, reportsRes, rulesRes, usersRes] = await Promise.all([
                    apiGet('/customers').catch(() => []),
                    apiGet('/reports').catch(() => []),
                    apiGet('/rules').catch(() => ({data: []})),
                    apiGet('/users').catch(() => ({data: []}))
                ]);

                const customers = Array.isArray(customersRes) ? customersRes : (customersRes.data || []);
                const reports = Array.isArray(reportsRes) ? reportsRes : (reportsRes.data || []);
                const rules = Array.isArray(rulesRes) ? rulesRes : (rulesRes.data || []);
                const users = Array.isArray(usersRes) ? usersRes : (usersRes.data || []);

                // 更新统计卡片
                document.getElementById('totalCustomers').textContent = customers.length;
                document.getElementById('totalReports').textContent = reports.length;
                document.getElementById('totalRules').textContent = rules.length;
                document.getElementById('totalUsers').textContent = users.length;

                // 渲染图表
                renderScoreChart(customers);
                renderRiskChart(customers);

            } catch (error) {
                console.error('加载数据失败:', error);
                showMessage('加载数据失败: ' + error.message, 'error');
            }
        }

        // 渲染评分分布图
        function renderScoreChart(customers) {
            const ctx = document.getElementById('scoreChart');
            if (!ctx) return;

            // 评分分布统计
            const scoreRanges = {
                '0-30': 0,
                '31-50': 0,
                '51-70': 0,
                '71-90': 0,
                '91-100': 0
            };

            customers.forEach(c => {
                const score = c.avg_score || 0;
                if (score <= 30) scoreRanges['0-30']++;
                else if (score <= 50) scoreRanges['31-50']++;
                else if (score <= 70) scoreRanges['51-70']++;
                else if (score <= 90) scoreRanges['71-90']++;
                else scoreRanges['91-100']++;
            });

            if (scoreChart) scoreChart.destroy();

            scoreChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['0-30', '31-50', '51-70', '71-90', '91-100'],
                    datasets: [{
                        label: '客户数量',
                        data: Object.values(scoreRanges),
                        backgroundColor: 'rgba(27, 58, 87, 0.8)',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // 渲染风险分布图
        function renderRiskChart(customers) {
            const ctx = document.getElementById('riskChart');
            if (!ctx) return;

            // 风险等级统计
            const riskLevels = { P0: 0, P1: 0, P2: 0 };
            customers.forEach(c => {
                const level = c.latest_risk_level || c.risk_level;
                if (level === 'P0') riskLevels.P0++;
                else if (level === 'P1') riskLevels.P1++;
                else if (level === 'P2') riskLevels.P2++;
            });

            if (riskChart) riskChart.destroy();

            riskChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['P0 高风险', 'P1 中风险', 'P2 低风险'],
                    datasets: [{
                        data: [riskLevels.P0, riskLevels.P1, riskLevels.P2],
                        backgroundColor: ['#FF6B6B', '#FF9F43', '#2ECC71']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
