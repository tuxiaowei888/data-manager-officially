<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 登录页UI测试</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui-common.css">
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-mid: #0f172a;
            --primary-light: #1e293b;
            --tech-accent: #00D2FF;
            --tech-secondary: #0ea5e9;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --text-disabled: rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(0, 210, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 210, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(0, 210, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .login-page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
        }

        .brand-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
        }

        .brand-content {
            text-align: center;
            color: white;
        }

        .brand-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.6) 0%, rgba(14, 165, 233, 0.6) 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 20px 60px rgba(0, 210, 255, 0.3);
            backdrop-filter: blur(20px);
        }

        .brand-icon i {
            font-size: 48px;
            color: white;
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 2px 20px rgba(0, 210, 255, 0.3);
        }

        .brand-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
        }

        .brand-features {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .brand-feature i {
            color: #00D2FF;
        }

        .login-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h2 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .glass-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #00D2FF;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
            background: rgba(255, 255, 255, 0.12);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .input-icon-wrapper .glass-input {
            padding-left: 48px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: #00D2FF;
        }

        .forgot-password {
            color: #00D2FF;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #4ECDC4;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .glass-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(14, 165, 233, 0.8) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .glass-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .register-link a {
            color: #00D2FF;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        @media (max-width: 768px) {
            .brand-side {
                display: none;
            }
            .login-side {
                padding: 30px;
            }
            .login-card {
                padding: 32px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="login-page">
        <div class="brand-side">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="bi bi-database-fill"></i>
                </div>
                <h1 class="brand-title">数维数据管家</h1>
                <p class="brand-subtitle">企业数据资产化智能管理平�?/p>
                <div class="brand-features">
                    <div class="brand-feature">
                        <i class="bi bi-shield-check"></i>
                        <span>安全合规</span>
                    </div>
                    <div class="brand-feature">
                        <i class="bi bi-lightning-charge"></i>
                        <span>高效智能</span>
                    </div>
                    <div class="brand-feature">
                        <i class="bi bi-graph-up"></i>
                        <span>数据洞察</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-side">
            <div class="login-card">
                <div class="login-header">
                    <h2>欢迎回来</h2>
                    <p>请登录您的账号继�?/p>
                </div>

                <form>
                    <div class="form-group">
                        <label class="form-label">用户�?/ 手机�?/label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" class="glass-input" placeholder="请输入用户名或手机号">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="glass-input" placeholder="请输入密�?>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>记住�?/span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码�?/a>
                    </div>

                    <button type="button" class="glass-btn">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        �?�?                    </button>

                    <div class="register-link">
                        还没有账号？<a href="/register">立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="ui-particles.js"></script>
    <script>
        initParticleBackground('particles-canvas', {
            particleCount: 100,
            particleColor: 'rgba(0, 210, 255, 0.6)',
            lineColor: 'rgba(0, 210, 255, 0.2)',
            showText: true
        });
    </script>
</body>
</html>
