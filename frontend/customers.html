<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 数维数据管家系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.8.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B3A57;
            --primary-dark: #0F4C81;
            --primary-light: #2E5A7C;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --success-light: #58D68D;
            --danger-color: #FF6B6B;
            --danger-light: #FFB3B3;
            --warning-color: #FF9F43;
            --bg-primary: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: #E8EDF2;
            --border-focus: #1B3A57;
            --gradient-brand: linear-gradient(135deg, #1B3A57 0%, #00D2FF 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --gradient-success: linear-gradient(135deg, #2ECC71 0%, #58D68D 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-family-zh);
            background: var(--bg-primary);
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: var(--bg-card);
            border-right: 1px solid var(--border-light);
            padding: 20px 0;
            z-index: 100;
        }
        
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 20px;
        }
        
        .sidebar-logo h1 {
            font-size: 16px;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sidebar-logo i { color: var(--tech-accent); }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background: rgba(0, 210, 255, 0.08);
            color: var(--tech-accent);
            border-left: 3px solid var(--tech-accent);
        }
        
        .main-content {
            margin-left: 240px;
            padding: 24px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .page-title i {
            color: var(--tech-accent);
            margin-right: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-light);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .stat-value {
            font-family: var(--font-family-num);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .stat-card.highlight .stat-value { color: var(--tech-accent); }
        .stat-card.vip .stat-value { color: var(--warning-color); }
        .stat-card.success .stat-value { color: var(--success-color); }
        
        .filter-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
        }
        
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .filter-input,
        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-card);
            min-width: 140px;
        }
        
        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--tech-accent);
        }
        
        .btn-search {
            background: var(--gradient-brand);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(27, 58, 87, 0.2);
        }

        .btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(27, 58, 87, 0.3);
        }

        .btn-reset {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background: var(--bg-primary);
            border-color: var(--text-disabled);
        }
        
        .customer-table {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }
        
        .data-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-bottom: none;
            position: relative;
        }

        .data-table th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--tech-accent);
        }
        
        .data-table td {
            padding: 14px 16px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-light);
            transition: background 0.2s ease;
        }
        
        .data-table tr:hover td { 
            background: rgba(0, 210, 255, 0.03); 
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .customer-name {
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .customer-contact {
            font-size: 12px;
            color: var(--text-disabled);
            margin-top: 2px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .badge.vip { background: rgba(255, 159, 67, 0.1); color: var(--warning-color); }
        .badge.normal { background: rgba(153, 168, 184, 0.1); color: var(--text-disabled); }
        .badge.active { background: rgba(46, 204, 113, 0.1); color: var(--success-color); }
        .badge.inactive { background: rgba(255, 107, 107, 0.1); color: var(--danger-color); }
        
        .score-high { color: var(--success-color); font-weight: 600; }
        .score-mid { color: var(--warning-color); font-weight: 600; }
        .score-low { color: var(--danger-color); font-weight: 600; }
        
        .action-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            transition: all 0.2s ease;
        }
        
        .action-btn:hover {
            border-color: var(--tech-accent);
            color: var(--tech-accent);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 17, 32, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            width: 800px;
            max-height: 90vh;
            overflow: hidden;
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
        }
        
        .modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .detail-section {
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title i { color: var(--tech-accent); }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .detail-item {
            background: var(--bg-primary);
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .report-list {
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .report-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .report-item:last-child { border-bottom: none; }
        .report-item:hover { background: var(--bg-primary); }
        
        .report-info { flex: 1; }
        
        .report-org {
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .report-date {
            font-size: 12px;
            color: var(--text-disabled);
            margin-top: 4px;
        }
        
        .report-score {
            font-size: 20px;
            font-weight: 700;
            margin-right: 16px;
        }
        
        .report-risk {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .risk-high { background: rgba(255, 107, 107, 0.1); color: var(--danger-color); }
        .risk-medium { background: rgba(255, 159, 67, 0.1); color: var(--warning-color); }
        .risk-low { background: rgba(46, 204, 113, 0.1); color: var(--success-color); }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-disabled);
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px;
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-btn.active {
            background: var(--tech-accent);
            color: white;
            border-color: var(--tech-accent);
        }
        
        .page-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 16px;
        }
    </style>
</head>

    <script>
        let currentPage = 1;
        let highValueOnly = false;
        let currentCustomerId = null;
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            if (!token || !userInfo) {
                window.location.href = '/login.html';
                return false;
            }
            try {
                const user = JSON.parse(userInfo);
                if (user.user_type !== 'admin') {
                    alert('无权限访�?);
                    window.location.href = '/index.html';
                    return false;
                }
            } catch (e) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        }
        
        async function loadStats() {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch('/api/v1/customers/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('加载失败');
                const stats = await response.json();
                document.getElementById('statTotal').textContent = stats.total_customers;
                document.getElementById('statVip').textContent = stats.vip_customers;
                document.getElementById('statToday').textContent = stats.active_today;
                document.getElementById('statWeek').textContent = stats.active_week;
                document.getElementById('statMonth').textContent = stats.active_month;
                document.getElementById('statHighValue').textContent = stats.high_value_count;
            } catch (e) {
                // 加载统计失败
            }
        }
        
        async function loadCustomers() {
            if (!checkAuth()) return;
            const token = localStorage.getItem('token');
            
            const params = new URLSearchParams();
            params.append('page', currentPage);
            params.append('page_size', 20);
            
            const keyword = document.getElementById('filterKeyword').value;
            const vipStatus = document.getElementById('filterVip').value;
            const registerTime = document.getElementById('filterRegister').value;
            
            if (keyword) params.append('keyword', keyword);
            if (vipStatus) params.append('vip_status', vipStatus);
            if (registerTime) params.append('register_time', registerTime);
            if (highValueOnly) params.append('high_value_only', 'true');
            
            try {
                const url = `/api/v1/customers?${params}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                console.log('Customers response:', response.status);
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Customers error:', errorText);
                    throw new Error(response.status);
                }
                const customers = await response.json();
                renderCustomers(customers);
            } catch (e) {
                document.getElementById('customerTableBody').innerHTML = 
                    '<tr><td colspan="8"><div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>加载失败: ' + e.message + '</p></div></td></tr>';
            }
        }
        
        function renderCustomers(customers) {
            const tbody = document.getElementById('customerTableBody');
            
            if (customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="bi bi-inbox"></i><p>暂无客户数据</p></div></td></tr>';
                return;
            }
            
            tbody.innerHTML = customers.map(c => `
                <tr style="${c.is_high_value ? '' : ''}">
                    <td>
                        <div class="customer-name">
                            ${c.username}
                            ${c.is_high_value ? '<i class="bi bi-star-fill" style="color: var(--warning-color); font-size: 12px; margin-left: 4px;"></i>' : ''}
                        </div>
                        <div class="customer-contact">${c.email || c.phone || '-'}</div>
                    </td>
                    <td>
                        <span class="badge ${c.is_vip ? 'vip' : 'normal'}">${c.is_vip ? 'VIP' : '普�?}</span>
                    </td>
                    <td>${c.total_evaluations}�?/td>
                    <td>
                        <span class="${getScoreClass(c.avg_score)}">${c.avg_score ? c.avg_score + '�? : '-'}</span>
                    </td>
                    <td>
                        <span class="${getScoreClass(c.latest_score)}">${c.latest_score ? c.latest_score + '�? : '-'}</span>
                    </td>
                    <td>${c.latest_eval_at || '-'}</td>
                    <td>${c.created_at || '-'}</td>
                    <td>
                        <button class="action-btn"
                             onclick="viewDetail(${c.id})" title="查看详情">
                            <i class="bi bi-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function getScoreClass(score) {
            if (!score) return '';
            if (score >= 80) return 'score-high';
            if (score >= 60) return 'score-mid';
            return 'score-low';
        }
        
        async function viewDetail(userId) {
            currentCustomerId = userId;
            const token = localStorage.getItem('token');
            
            try {
                const [detailRes, reportsRes] = await Promise.all([
                    fetch(`/api/v1/customers/${userId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`/api/v1/customers/${userId}/reports`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);
                
                const detail = await detailRes.json();
                const reports = await reportsRes.json();
                
                document.getElementById('basicInfo').innerHTML = `
                    <div class="detail-item">
                        <div class="detail-label">用户�?/div>
                        <div class="detail-value">${detail.username}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">邮箱</div>
                        <div class="detail-value">${detail.email || '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">手机</div>
                        <div class="detail-value">${detail.phone || '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">VIP状�?/div>
                        <div class="detail-value">${detail.is_vip ? 'VIP用户' : '普通用�?}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">VIP到期</div>
                        <div class="detail-value">${detail.vip_expire_date || '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">注册时间</div>
                        <div class="detail-value">${detail.created_at || '-'}</div>
                    </div>
                `;
                
                document.getElementById('evalStats').innerHTML = `
                    <div class="detail-item">
                        <div class="detail-label">总评估次�?/div>
                        <div class="detail-value">${detail.total_evaluations}�?/div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">今日评估</div>
                        <div class="detail-value">${detail.daily_eval_count}�?/div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">平均评分</div>
                        <div class="detail-value">${detail.avg_score ? detail.avg_score + '�? : '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">最新评�?/div>
                        <div class="detail-value">${detail.latest_score ? detail.latest_score + '�? : '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">最后评�?/div>
                        <div class="detail-value">${detail.latest_eval_at || '-'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">最后登�?/div>
                        <div class="detail-value">${detail.last_login_at || '-'}</div>
                    </div>
                `;
                
                if (reports.length === 0) {
                    document.getElementById('reportList').innerHTML = '<div class="empty-state"><i class="bi bi-file-earmark-x"></i><p>暂无评估报告</p></div>';
                } else {
                    document.getElementById('reportList').innerHTML = reports.map(r => `
                        <div class="report-item"
                             onclick="viewReport(${r.id})">
                            <div class="report-info">
                                <div class="report-org">${r.org_name || '未命名企�?}</div>
                                <div class="report-date">${r.created_at}</div>
                            </div>
                            <div class="report-score ${getScoreClass(r.total_score)}">${r.total_score}�?/div>
                            <span class="report-risk ${getRiskClass(r.risk_level)}">${getRiskText(r.risk_level)}</span>
                        </div>
                    `).join('');
                }
                
                document.getElementById('detailModal').classList.add('active');
            } catch (e) {
                alert('加载详情失败');
            }
        }
        
        function getRiskClass(level) {
            if (level === 'P0') return 'risk-high';
            if (level === 'P1') return 'risk-medium';
            return 'risk-low';
        }
        
        function getRiskText(level) {
            const map = { 'P0': '高风�?, 'P1': '中风�?, 'P2': '低风�? };
            return map[level] || level;
        }
        
        async function viewReport(reportId) {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`/api/v1/customers/${currentCustomerId}/reports/${reportId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const report = await response.json();
                
                let detailHtml = `
                    <div class="detail-section">
                        <div class="section-title"><i class="bi bi-building"></i> 企业信息</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">企业名称</div>
                                <div class="detail-value">${report.org_name || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">总分</div>
                                <div class="detail-value ${getScoreClass(report.total_score)}">${report.total_score}�?/div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">风险等级</div>
                                <div class="detail-value">${getRiskText(report.risk_level)}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                if (report.detail && report.detail.dimensions) {
                    detailHtml += `
                        <div class="detail-section">
                            <div class="section-title"><i class="bi bi-pie-chart"></i> 维度评分</div>
                            <div class="detail-grid">
                                ${report.detail.dimensions.map(d => `
                                    <div class="detail-item">
                                        <div class="detail-label">${d.name}</div>
                                        <div class="detail-value ${getScoreClass(d.score)}">${d.score}�?/div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                document.getElementById('reportDetail').innerHTML = detailHtml;
                document.getElementById('reportModal').classList.add('active');
            } catch (e) {
                alert('加载报告失败');
            }
        }
        
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('active');
        }
        
        function searchCustomers() {
            currentPage = 1;
            loadCustomers();
        }
        
        function resetFilters() {
            document.getElementById('filterKeyword').value = '';
            document.getElementById('filterVip').value = '';
            document.getElementById('filterRegister').value = '';
            document.getElementById('filterActive').value = '';
            document.getElementById('filterEvalCount').value = '';
            highValueOnly = false;
            currentPage = 1;
            loadCustomers();
        }
        
        function filterHighValue() {
            highValueOnly = !highValueOnly;
            currentPage = 1;
            loadCustomers();
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            window.location.href = '/login.html';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadCustomers();
        });
    </script>
</body>
</html>
