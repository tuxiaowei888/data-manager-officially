<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家 - 首页UI测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui-common.css">
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-mid: #0f172a;
            --primary-light: #1e293b;
            --tech-accent: #00D2FF;
            --tech-secondary: #0ea5e9;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --text-disabled: rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(0, 210, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 210, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(0, 210, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .main-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(14, 165, 233, 0.8) 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .nav-logo i {
            font-size: 24px;
            color: white;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .nav-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-link {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.4);
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00D2FF 0%, #0ea5e9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.4);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue {
            background: rgba(0, 210, 255, 0.2);
            color: #00D2FF;
        }

        .stat-icon.green {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .stat-icon.yellow {
            background: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
        }

        .stat-icon.red {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .stat-trend.up {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
        }

        .stat-trend.down {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        .stat-value {
            font-family: "Roboto Mono", monospace;
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        /* 内容区域 */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 28px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #00D2FF;
        }

        .card-action {
            padding: 8px 16px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #00D2FF;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card-action:hover {
            background: rgba(0, 210, 255, 0.2);
        }

        /* 快捷入口 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .quick-action {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .quick-action:hover {
            background: rgba(0, 210, 255, 0.12);
            transform: translateX(4px);
        }

        .quick-action-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .quick-action-icon.cyan {
            background: rgba(0, 210, 255, 0.2);
            color: #00D2FF;
        }

        .quick-action-icon.green {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .quick-action-icon.purple {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
        }

        .quick-action-icon.orange {
            background: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
        }

        .quick-action-text h4 {
            color: white;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .quick-action-text p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        /* 最近报告列表 */
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .report-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .report-item:hover {
            background: rgba(0, 210, 255, 0.08);
        }

        .report-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .report-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00D2FF;
        }

        .report-title {
            color: white;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .report-date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .report-score {
            font-family: "Roboto Mono", monospace;
            font-size: 18px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .report-score.high {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
        }

        .report-score.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
        }

        .report-score.low {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="main-content">
        <!-- 顶部导航 -->
        <nav class="top-nav">
            <div class="nav-brand">
                <div class="nav-logo">
                    <i class="bi bi-database-fill"></i>
                </div>
                <div>
                    <div class="nav-title">数维数据管家</div>
                    <div class="nav-subtitle">数据资产化智能管理</div>
                </div>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">
                    <i class="bi bi-house-door me-1"></i>首页
                </a>
                <a href="/survey" class="nav-link">
                    <i class="bi bi-clipboard-data me-1"></i>调研
                </a>
                <a href="/knowledge" class="nav-link">
                    <i class="bi bi-book me-1"></i>知识库
                </a>
                <a href="/history" class="nav-link">
                    <i class="bi bi-clock-history me-1"></i>历史
                </a>
            </div>
            <div class="nav-user">
                <div class="user-info">
                    <div class="user-name">张三</div>
                    <div class="user-role">VIP会员</div>
                </div>
                <div class="user-avatar">Z</div>
            </div>
        </nav>

        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">数据概览</h1>
            <p class="page-subtitle">实时监控企业数据资产健康状态</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon blue">
                        <i class="bi bi-clipboard-check"></i>
                    </div>
                    <div class="stat-trend up">
                        <i class="bi bi-arrow-up"></i> 12%
                    </div>
                </div>
                <div class="stat-value">156</div>
                <div class="stat-label">已完成调研</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon green">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <div class="stat-trend up">
                        <i class="bi bi-arrow-up"></i> 8%
                    </div>
                </div>
                <div class="stat-value">89</div>
                <div class="stat-label">合规规则</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon yellow">
                        <i class="bi bi-book"></i>
                    </div>
                    <div class="stat-trend down">
                        <i class="bi bi-arrow-down"></i> 3%
                    </div>
                </div>
                <div class="stat-value">2,340</div>
                <div class="stat-label">知识条目</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon red">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="stat-trend up">
                        <i class="bi bi-arrow-up"></i> 5%
                    </div>
                </div>
                <div class="stat-value">1,280</div>
                <div class="stat-label">客户数据</div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content-grid">
            <!-- 快捷入口 -->
            <div class="glass-card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="bi bi-lightning-charge"></i>
                        快捷入口
                    </h3>
                </div>
                <div class="quick-actions">
                    <a href="/survey" class="quick-action">
                        <div class="quick-action-icon cyan">
                            <i class="bi bi-clipboard-plus"></i>
                        </div>
                        <div class="quick-action-text">
                            <h4>新建调研</h4>
                            <p>创建数据资产调研</p>
                        </div>
                    </a>
                    <a href="/knowledge" class="quick-action">
                        <div class="quick-action-icon green">
                            <i class="bi bi-book-plus"></i>
                        </div>
                        <div class="quick-action-text">
                            <h4>知识录入</h4>
                            <p>添加知识条目</p>
                        </div>
                    </a>
                    <a href="/reports" class="quick-action">
                        <div class="quick-action-icon purple">
                            <i class="bi bi-graph-up-arrow"></i>
                        </div>
                        <div class="quick-action-text">
                            <h4>数据报表</h4>
                            <p>查看数据报告</p>
                        </div>
                    </a>
                    <a href="/customers" class="quick-action">
                        <div class="quick-action-icon orange">
                            <i class="bi bi-person-plus"></i>
                        </div>
                        <div class="quick-action-text">
                            <h4>客户管理</h4>
                            <p>管理客户数据</p>
                        </div>
                    </a>
                </div>
            </div>

            <!-- 最近报告 -->
            <div class="glass-card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="bi bi-clock-history"></i>
                        最近报告
                    </h3>
                    <button class="card-action">查看全部</button>
                </div>
                <div class="report-list">
                    <div class="report-item">
                        <div class="report-info">
                            <div class="report-icon">
                                <i class="bi bi-file-earmark-text"></i>
                            </div>
                            <div>
                                <div class="report-title">科技公司数据资产调研</div>
                                <div class="report-date">2026-03-18</div>
                            </div>
                        </div>
                        <div class="report-score high">92</div>
                    </div>
                    <div class="report-item">
                        <div class="report-info">
                            <div class="report-icon">
                                <i class="bi bi-file-earmark-text"></i>
                            </div>
                            <div>
                                <div class="report-title">制造业数据治理评估</div>
                                <div class="report-date">2026-03-15</div>
                            </div>
                        </div>
                        <div class="report-score medium">78</div>
                    </div>
                    <div class="report-item">
                        <div class="report-info">
                            <div class="report-icon">
                                <i class="bi bi-file-earmark-text"></i>
                            </div>
                            <div>
                                <div class="report-title">零售业数据合规检查</div>
                                <div class="report-date">2026-03-12</div>
                            </div>
                        </div>
                        <div class="report-score low">65</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="ui-particles.js"></script>
    <script>
        initParticleBackground('particles-canvas', {
            particleCount: 60,
            particleColor: 'rgba(0, 210, 255, 0.5)',
            lineColor: 'rgba(0, 210, 255, 0.15)'
        });
    </script>
</body>
</html>
