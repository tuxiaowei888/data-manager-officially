<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数维数据管家系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B3A57;
            --primary-dark: #0F4C81;
            --primary-light: #2E5A7C;
            --tech-accent: #00D2FF;
            --tech-secondary: #4ECDC4;
            --success-color: #2ECC71;
            --danger-color: #FF6B6B;
            --warning-color: #FF9F43;
            --bg-primary: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1120;
            --text-primary: #1B3A57;
            --text-secondary: #5A6C7D;
            --text-disabled: #99A8B8;
            --border-light: #E8EDF2;
            --gradient-brand: linear-gradient(135deg, #1B3A57 0%, #00D2FF 100%);
            --gradient-tech: linear-gradient(135deg, #00D2FF 0%, #4ECDC4 100%);
            --font-family-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
            --font-family-num: "Roboto Mono", "DIN Alternate", "SF Mono", monospace;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font-family-zh);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
        }
        
        .login-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        
        .brand-section {
            flex: 1;
            background: var(--gradient-brand);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .brand-section::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 70%);
            animation: brandGlow 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .brand-grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            height: 1px;
            width: 100%;
            left: 0;
            animation: gridScan 4s linear infinite;
        }

        .brand-grid-line.line-1 { top: 20%; animation-delay: 0s; }
        .brand-grid-line.line-2 { top: 40%; animation-delay: 1s; }
        .brand-grid-line.line-3 { top: 60%; animation-delay: 2s; }
        .brand-grid-line.line-4 { top: 80%; animation-delay: 3s; }

        @keyframes gridScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .brand-floating {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floating 6s ease-in-out infinite;
        }

        .brand-floating:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .brand-floating:nth-child(2) { top: 25%; right: 25%; animation-delay: 1s; }
        .brand-floating:nth-child(3) { top: 60%; left: 15%; animation-delay: 2s; }
        .brand-floating:nth-child(4) { top: 70%; right: 20%; animation-delay: 3s; }
        .brand-floating:nth-child(5) { top: 85%; left: 30%; animation-delay: 4s; }

        @keyframes floating {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }
        
        .brand-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 480px;
        }
        
        .brand-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            backdrop-filter: blur(10px);
        }
        
        .brand-logo i {
            font-size: 40px;
            color: white;
        }
        
        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .brand-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .brand-features {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .feature-item:last-child {
            border-bottom: none;
        }
        
        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .feature-icon i {
            font-size: 18px;
        }
        
        .feature-text {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .feature-text strong {
            display: block;
            font-size: 15px;
            margin-bottom: 2px;
        }
        
        .form-section {
            width: 520px;
            min-width: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            background: var(--bg-card);
        }
        
        .form-header {
            margin-bottom: 32px;
        }
        
        .form-title {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .form-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-disabled);
            font-size: 18px;
            transition: color 0.2s ease;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--tech-accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }
        
        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: var(--tech-accent);
        }
        
        ::placeholder {
            color: var(--text-disabled);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .form-check-label {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .forgot-link {
            font-size: 13px;
            color: var(--tech-accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .forgot-link:hover {
            color: var(--primary-color);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--gradient-brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(27, 58, 87, 0.25);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(27, 58, 87, 0.35);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: var(--text-disabled);
            font-size: 13px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        
        .divider span {
            padding: 0 16px;
        }
        
        .register-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .register-link a {
            color: var(--tech-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .register-link a:hover {
            color: var(--primary-color);
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-danger {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }
        
        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }
        
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-disabled);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .guest-link {
            text-align: center;
            margin-top: 16px;
        }
        
        .guest-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }
        
        .guest-link a:hover {
            color: var(--tech-accent);
        }
        
        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }
            
            .form-section {
                width: 100%;
                min-width: auto;
                max-width: 480px;
                margin: 0 auto;
                padding: 40px;
            }
        }
        
        @media (max-width: 480px) {
            .form-section {
                padding: 30px 24px;
            }
            
            .form-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-section">
            <div class="brand-grid-line line-1"></div>
            <div class="brand-grid-line line-2"></div>
            <div class="brand-grid-line line-3"></div>
            <div class="brand-grid-line line-4"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-floating"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="bi bi-pie-chart-fill"></i>
                </div>
                <h1 class="brand-title">数维·数据资产管家</h1>
                <p class="brand-subtitle">数据要素资产化智能评估平台<br>让数据价值看得见、可量化、能变现</p>
                
                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-clipboard-data"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数据资产深度调研</strong>
                            6大维度全面采集企业信息，精准画像
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-brain"></i>
                        </div>
                        <div class="feature-text">
                            <strong>数维·智规融合评估</strong>
                            规则库+知识库+AI三位一体智能诊断
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="bi bi-phone"></i>
                        </div>
                        <div class="feature-text">
                            <strong>双端一体化加持</strong>
                            Web端+小程序双端联动，数据随时可查
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-header">
                <h2 class="form-title">账号登录</h2>
                <p class="form-desc">欢迎使用数维·数据资产管家平台</p>
            </div>
            
            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">
                    登 录
                </button>
            </form>
            
            <div class="divider">
                <span>还没有账号？</span>
            </div>
            
            <div class="register-link">
                <a href="/register">立即注册</a>，开启数据资产化之旅
            </div>
            
            <div class="guest-link">
                <a href="/survey">暂不登录，直接体验</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }
        
        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }
        
        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    if (data && data.data) {
                        const userType = data.data.user_type;
                        if (userType === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/home';
                        }
                    }
                })
                .catch(() => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('userInfo');
                });
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showError('请填写用户名和密码');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', result.access_token);
                    
                    const userType = result.user_type || 'client';
                    localStorage.setItem('userInfo', JSON.stringify({ username, user_type: userType }));
                    
                    if (userType === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/home';
                    }
                } else {
                    showError(result.detail || '登录失败，请检查用户名和密码');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }
        });
        
        checkAuth();
    </script>
</body>
</html>
